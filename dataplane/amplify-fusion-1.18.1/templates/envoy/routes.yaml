{{- if and .Values.multihost.enabled .Values.envoy.route.https.enabled -}}
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ template "envoy.appName" . }}-https
  namespace: {{ .Release.Namespace }}
  labels:
{{- include "envoy.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ template "envoy.appName" . }}
spec:
  host: {{ .Values.multihost.listeners.tls.https.hostPrefix }}.{{ .Values.external_domain }}
  to:
    kind: Service
    name: {{ template "envoy.appName" . }}
  port:
    targetPort: 8443
  tls:
    termination: passthrough
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
