{{- if and .Values.fluentBit.enabled (eq .Values.fluentBit.kind "Deployment") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "fluent-bit.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
data:
  custom_parsers.conf: |
    {{- if and (include "valkey.internal.enabled" .) .Values.logging.logJsonEnabled }}
    [PARSER]
        Name        valkey_logfmt
        Format      logfmt
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
    {{- end }}

  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        storage.path {{ include "efs_root.value" . -}}/fluent-bit/storage
        storage.backlog.flush_on_shutdown On
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port {{ .Values.fluentBit.metricsPort }}
        Health_Check On
        Hot_Reload On

    {{- with .Values.fluentBit.config.service }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

  {{- $inputs := list
    (dict "name" "inbound" "path" "inbound/*/inbound/inbound.log" "tag" "inbound.app.log*")
    (dict "name" "ir" "path" "ir/*/orchestrator.log" "tag" "orchestrator.app.log*")
    (dict "name" "pep-server" "path" "pep-server/*/pep-server.log" "tag" "pep-server.app.log*")
    (dict "name" "sinkagent" "path" "sinkagent/*/sinkagent.log" "tag" "sinkagent.app.log*")
  -}}
  {{- if (include "valkey.internal.enabled" .) -}}
    {{- $inputs = append $inputs (dict "name" "valkey" "path" "valkey/*/valkey.log" "tag" "valkey.app.log*") -}}
  {{- end -}}
  {{- if eq  (include "parent.dataplaneMode" . ) "shared" }}
    {{- $inputs = append $inputs (dict "name" "fusion-operator" "path" "fusion-operator/*/fusion-operator*.log" "tag" "fusion-operator.app.log*") }}
  {{- end }}
  {{- $efsRoot := include "efs_root.value" . }}
  {{- range $inputs }}
    [INPUT]
        Name tail
        Path {{ $efsRoot }}/logs/{{ .path }}
        multiline.parser docker, cri
        DB {{ $efsRoot }}/fluent-bit/storage/{{ .name }}-tail.db
        DB.locking true
        Ignore_Older 1d
        storage.type filesystem
        read_from_head true
        Tag {{ .tag }}
        Skip_Long_Lines On
  
  {{- end }}
  
    [INPUT]
        Name   opentelemetry
        Listen 0.0.0.0
        Port   4317
        Tag_From_URI Off
        Tag    otel_grpc
{{- if .Values.zerotrust.enabled }}
        tls on
        tls.verify on
        tls.verify_client_cert on
        tls.crt_file /tls/server.crt
        tls.key_file /tls/server.key
        tls.ca_file /tls/ca.crt
{{- end }}
    
    [INPUT]
        Name   opentelemetry
        Listen 0.0.0.0
        Port   4318
        Tag_From_URI Off
        Tag    otel_http
{{- if .Values.zerotrust.enabled }}
        tls on
        tls.verify on
        tls.verify_client_cert on
        tls.crt_file /tls/server.crt
        tls.key_file /tls/server.key
        tls.ca_file /tls/ca.crt
{{- end }}

  {{- if and (include "valkey.internal.enabled" .) .Values.logging.logJsonEnabled }}
    [FILTER]
        Name         parser
        Match        valkey.app.log*
        Key_Name     log
        Parser       valkey_logfmt
        Reserve_Data On
        Preserve_Key On
  {{- end }}

    {{- with .Values.fluentBit.config.inputs }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

    {{- with .Values.fluentBit.config.filters }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

    {{- with .Values.fluentBit.config.outputs }}
    {{ tpl . $ | nindent 4 }}
    {{- else }}
    # Fallback output: required to let Fluent Bit ACK records/chunks even when
    # business side-effects are done in Lua filters.
    [OUTPUT]
        Name null
        Match *
    {{- end }}
  {{- end }}