{{- if .Values.valkey.enabled }}
{{- if .Values.secrets.datagrid.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.datagrid.name ).metadata | required "Secret .Values.secrets.datagrid.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.datagrid.name }}
type: "Opaque"
stringData:
  datagrid_password: {{ required "Value datagridPassword is required for the database secret"  .Values.secrets.datagrid.password }}
{{- end }}
{{- end }}
