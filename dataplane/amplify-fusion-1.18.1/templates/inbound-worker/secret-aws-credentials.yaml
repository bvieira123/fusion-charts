{{- if eq .Values.inboundWorker.aws.enabled true }}
{{- if .Values.secrets.inboundWorkerAws.existingSecret }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.inboundWorkerAws.name ).metadata | required "Secret .Values.secrets.inboundWorkerAws.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.inboundWorkerAws.name }}
  namespace: {{ .Release.Namespace }}
type: "Opaque"
stringData:
  Access_Key: {{ required "Value accessKey is required for the inboundWorkerAws secret" .Values.secrets.inboundWorkerAws.accessKey }}
  Secret_Key: {{ required "Value secretKey is required for the inboundWorkerAws secret" .Values.secrets.inboundWorkerAws.secretKey }}
{{- end }}
{{- end }}
