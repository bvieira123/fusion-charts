{{- if eq (include "valkey.internal.subQuorumFailoverRequired" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valkeyFailoverController.name" . }}-role-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "valkeyFailoverController.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "valkeyFailoverController.name" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
