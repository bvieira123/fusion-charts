{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) .Values.zerotrust.providers.spire.server.calicoNetpol.enabled }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . }}
spec:
  order: 10
  selector: dplane == 'spire-server'
  types:
    - Ingress
    - Egress
  ingress:
    ### IMPORTANT: spire-agent uses hostNetwork:true, so all connections arrive at spire-server
    ### from the NODE IP, not the agent pod IP. A pod-selector source rule won't match — configure
    ### inboundRule with a net (CIDR) covering the cluster node IP range.
    ### gRPC — agent node attestation and SVID issuance ###
    - action: Allow
      protocol: TCP
      source: {{ toYaml .Values.zerotrust.providers.spire.server.calicoNetpol.inboundRule | nindent 8 }}
      destination:
        ports:
          - 8081
    ### Health checks — kubelet liveness/readiness probes and spire-agent init container ###
    ### The init-server init container in the spire-agent DaemonSet polls :8080/ready before  ###
    ### starting. Both the kubelet and the init container arrive from the node IP.             ###
    - action: Allow
      protocol: TCP
      source: {{ toYaml .Values.zerotrust.providers.spire.server.calicoNetpol.inboundRule | nindent 8 }}
      destination:
        ports:
          - 8080
    ### Registrar health checks — kubelet liveness/readiness probes for spire-registrar ###
    ### The registrar's health port (default 8090; distinct from spire-server's fixed 8080/8081). ###
    - action: Allow
      protocol: TCP
      source: {{ toYaml .Values.zerotrust.providers.spire.server.calicoNetpol.inboundRule | nindent 8 }}
      destination:
        ports:
          - {{ .Values.zerotrust.providers.spire.server.registrar.healthPort }}
  egress:
    # allow to communicate to DNS pods
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    # allow to communicate with k8s API server (token reviews, node/pod/namespace lookups)
    - action: Allow
      destination:
        services:
          name: kubernetes
          namespace: default
      protocol: TCP
    {{- if .Values.zerotrust.providers.spire.server.calicoNetpol.outboundRule }}
    ### Outbound to external endpoints (e.g. AWS KMS: kms.<region>.amazonaws.com:443) ###
    - action: Allow
      protocol: TCP
      destination: {{ toYaml .Values.zerotrust.providers.spire.server.calicoNetpol.outboundRule | nindent 8 }}
    {{- end }}
{{- end }}
