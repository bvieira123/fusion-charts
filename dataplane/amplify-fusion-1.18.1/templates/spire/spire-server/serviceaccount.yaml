{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) .Values.zerotrust.providers.spire.server.serviceAccount.enabled (not .Values.zerotrust.providers.spire.server.serviceAccount.preexisting) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "spire-server.serviceAccountName" . }}
  namespace: {{ include "spire.namespace" . }}
  labels:
    {{ include "spire-server.labels" . | nindent 4 }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
    {{- with .Values.zerotrust.providers.spire.server.serviceAccount.annotations }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.zerotrust.providers.spire.server.serviceAccount.automountServiceAccountToken }}
{{- end }}
