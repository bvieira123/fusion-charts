{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
{{- if not (eq .Values.image.createPullSecret.dockerconfigjson "") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ampint-docker-artifactory
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ required "a valid dockerconfigjson is required for the secret ampint-docker-artifactory" .Values.image.createPullSecret.dockerconfigjson }}
{{- end }}
{{- end }}
