{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spire-agent.fullname" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spire-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "spire-agent.serviceAccountName" . }}
    namespace: {{ include "spire.namespace" . }}
{{- end }}
