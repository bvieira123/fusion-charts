{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "spire-agent.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ include "spire-agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{ include "spire-agent.selectorLabels" . | nindent 8 }}
        {{ .Values.zerotrust.managedLabel }}: "true"
      {{- with .Values.zerotrust.providers.spire.agent.podAnnotations }}
      annotations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      hostPID: true
      hostNetwork: true
      serviceAccountName: {{ include "spire-agent.serviceAccountName" . }}
      {{- if .Values.zerotrust.providers.spire.agent.podSecurityContextEnabled }}
      securityContext:
        {{ toYaml .Values.zerotrust.providers.spire.agent.podSecurityContext | nindent 8 }}
      {{- end }}
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-socket-dir
          image: "{{ default .Values.image.repository .Values.image.alpinetools.image.repository }}/{{ .Values.image.alpinetools.image.name }}:{{ .Values.image.alpinetools.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
          command:
            - /bin/sh
            - -c
            - |
              echo "Ensuring correct ownership on spire-agent socket directory..."
              chown {{ .Values.zerotrust.providers.spire.agent.podSecurityContext.runAsUser }}:{{ .Values.zerotrust.providers.spire.agent.podSecurityContext.runAsGroup }} {{ .Values.zerotrust.providers.spire.workload.socketHostPath }}
              chmod 0755 {{ .Values.zerotrust.providers.spire.workload.socketHostPath }}
              echo "Socket directory ownership set."
          volumeMounts:
            - name: {{ .Values.zerotrust.providers.spire.workload.volumeName }}
              mountPath: {{ .Values.zerotrust.providers.spire.workload.socketHostPath }}
          resources:
            {{- toYaml .Values.image.initContainers.resources | nindent 12 }}
        {{- if eq .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.type "hostCert" }}
        - name: init-kubelet-ca
          image: "{{ default .Values.image.repository .Values.image.alpinetools.image.repository }}/{{ .Values.image.alpinetools.image.name }}:{{ .Values.image.alpinetools.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
          command:
            - /bin/sh
            - -c
            - |
              cp /mnt/kubelet-ca-host/{{ base .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.hostPath }} /run/spire/agent/kubelet-ca.crt
              chmod 0644 /run/spire/agent/kubelet-ca.crt
              echo "Kubelet CA copied."
          volumeMounts:
            - name: kubelet-ca-host
              mountPath: /mnt/kubelet-ca-host
              readOnly: true
            - name: spire-agent-data
              mountPath: /run/spire/agent
          resources:
            {{- toYaml .Values.image.initContainers.resources | nindent 12 }}
        {{- end }}
        - name: init-server
          image: "{{ default .Values.image.repository .Values.image.alpinetools.image.repository }}/{{ .Values.image.alpinetools.image.name }}:{{ .Values.image.alpinetools.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.zerotrust.providers.spire.agent.securityContext }}
          securityContext:
            {{ toYaml .Values.zerotrust.providers.spire.agent.securityContext | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              until nslookup {{ include "spire-server.fullname" . }}.{{ include "spire.namespace" . }}.svc.cluster.local; do
                echo "Waiting for spire-server DNS..."
                sleep 2
              done
              echo "spire-server DNS resolved. Waiting for spire-server to be ready..."
              until curl -sf http://{{ include "spire-server.fullname" . }}.{{ include "spire.namespace" . }}.svc.cluster.local:8080/ready; do
                echo "Waiting for spire-server /ready..."
                sleep 2
              done
              echo "spire-server is ready."
      containers:
        - name: spire-agent
          image: "{{ default .Values.image.repository .Values.zerotrust.providers.spire.agent.image.repository }}/{{ .Values.zerotrust.providers.spire.agent.image.name }}:{{ .Values.zerotrust.providers.spire.agent.image.buildTag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config
            - /run/spire/config/agent.conf
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: healthz
              containerPort: {{ .Values.zerotrust.providers.spire.agent.healthPort }}
              protocol: TCP
          livenessProbe: {{- toYaml .Values.zerotrust.providers.spire.agent.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.zerotrust.providers.spire.agent.readinessProbe | nindent 12 }}
          {{- if .Values.zerotrust.providers.spire.agent.securityContext }}
          securityContext:
            {{ toYaml .Values.zerotrust.providers.spire.agent.securityContext | nindent 12 }}
          {{- end }}
          resources:
            {{ toYaml .Values.zerotrust.providers.spire.agent.resources | nindent 12 }}
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-agent-data
              mountPath: /run/spire/agent
            - name: {{ .Values.zerotrust.providers.spire.workload.volumeName }}
              mountPath: {{ .Values.zerotrust.providers.spire.workload.socketHostPath }}
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: spire-token
              mountPath: /var/run/secrets/tokens
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: spire-config
          configMap:
            name: {{ include "spire-agent.fullname" . }}
        - name: spire-agent-data
          emptyDir: {}
        - name: {{ .Values.zerotrust.providers.spire.workload.volumeName }}
          hostPath:
            path: {{ .Values.zerotrust.providers.spire.workload.socketHostPath }}
            type: DirectoryOrCreate
        - name: spire-bundle
          configMap:
            name: {{ .Values.zerotrust.providers.spire.server.bundleConfigMapName }}
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  optional: true
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- if eq .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.type "hostCert" }}
        - name: kubelet-ca-host
          hostPath:
            path: {{ dir .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.hostPath }}
            type: Directory
        {{- end }}
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      {{- with .Values.zerotrust.providers.spire.agent.tolerations }}
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zerotrust.providers.spire.agent.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zerotrust.providers.spire.agent.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zerotrust.providers.spire.agent.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
