{{- if ( and .Values.pepServer.serviceAccount.enabled ( not .Values.pepServer.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pep-server.serviceAccountName" . }}
  labels:
    {{- include "pep-server.labels" . | nindent 4 }}
  {{- with .Values.pepServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.pepServer.serviceAccount.automountServiceAccountToken }}
{{- end }}
