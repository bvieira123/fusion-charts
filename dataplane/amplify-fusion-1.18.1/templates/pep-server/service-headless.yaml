apiVersion: v1
kind: Service
metadata:
  name: {{ template "pep-server.appName" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pep-server.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "pep-server.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $port := .Values.pepServer.service.ports }}
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort }}
    {{- end }}
