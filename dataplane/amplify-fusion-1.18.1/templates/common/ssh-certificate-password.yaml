{{- if .Values.tls.sshCertificate.enabled -}}
{{- if eq .Values.tls.sshCertificate.password "" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "ssh-certificate-password").metadata | required "Secret 'ssh-certificate-password' is required. Create it external to helm chart or set tls.sshCertificate.password" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-certificate-password
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ required "tls.sshCertificate.password is required for secret ssh-certificate-password" .Values.tls.sshCertificate.password }}
{{- end }}
{{- end -}}
