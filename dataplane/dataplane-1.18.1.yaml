    inputs: ""
    filters: ""
    outputs: ""

  existingConfigMap: ""

  env: []

  envWithTpl: []

  extraContainers: []

  metricsPort: 2020

  extraPorts: []

  extraVolumes: []

  extraVolumeMounts: []

  labels: {}

  annotations: {}

  podAnnotations: {}

  podLabels: {}

  # @schema
  # type: integer
  # @schema
  minReadySeconds: 0

  daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
