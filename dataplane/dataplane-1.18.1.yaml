  env: []

######################################
##      Orchestrator                ##
######################################

orchestrator:
  enabled: true

  ######################################
  ##      Image                       ##
  ######################################

  image:
    name: 1.18.1/orchestrator
    buildTag: 1.18.1

  ######################################
  ##      Service                     ##
  ######################################

  service:
    ports:
    - name: internal
      protocol: TCP
      port: 1919
      targetPort: 1919
    - name: grpc-port
      protocol: TCP
      port: 50051
      targetPort: 50051
    - name: sse-port
      protocol: TCP
      port: 50052
      targetPort: 50052


  ######################################
  ##      Persistence                 ##
  ######################################
  #EBS_hostPath
  ebs_root: "/transaction-data"
  txn_log_base_path: "/transaction-logs"

  #EFS_Filesystem
  efs_txn_log_path: "/efs/transaction-logs"

  #JWT_TTL
  jwtExpirationTimeout: 10

  # NFS Connector config - disabled by default
  connectors:
    # NFS connector config
    nfs:
      # enable/disable NFS volumes mount
      enabled: false
      mode: csi
      # Configure NFS volumes mounted into the orchestrator file system.
      # Volumes are mounted under /connectors/nfs/<name>
      volumes:
      - name: "local-volume-name"
          # server IP : sl1087339.aabc
        server: "nfs-server"
          # share path : /nf-op-buch
        share: "nfs-server-share"
        mountOptions:   # put your mount options here, as a yaml list
        - nfsvers=4.1

  ######################################
  ##      Probes                      ##
  ######################################

  #orchestrator startupProbe
  startupProbe:
    httpGet:
      path: /q/health/started
      port: management
    initialDelaySeconds: 10
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
    successThreshold: 1

  #orchestrator readinessProbe
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: management
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 1
    successThreshold: 1

  #orchestrator livenessProbe
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: management
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  terminationGracePeriodSeconds: 3600
  preStopSleepSeconds: "40s"

  ######################################
  ##      Security                    ##
  ######################################

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  #serviceaccount for orchestrator
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "orchestrator"
    automountServiceAccountToken: true

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################

  # Use the following block if you have Calico and want to use its network policies
  # You will need the Calico API server to be installed as well
  calicoNetpol:
    enabled: false
    # reference the targets the orchestrator is allowed to reach
    outboundRule: {}
      # use this to reference a (preexisting) networkset
      #selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidr here
    # managementRule: source allowed to reach the management port (8181) for kubelet probes.
    # Use a net (CIDR) covering the cluster node IP range, or a Calico selector.
    # NOTE: leaving empty ({}) renders `source: {}` → port 8181 OPEN to all cluster traffic.
    # Example:
    #   managementRule:
    #     nets:
    #       - 10.0.0.0/16    # VPC CIDR containing all cluster nodes
    managementRule: {}
    # prometheusRule: Calico EntityRule selecting the Prometheus instance(s) allowed to scrape
    # /q/metrics on port 8181. Empty ({}) = Prometheus blocked.
    # Examples:
    #   In-cluster Prometheus:
    #     prometheusRule:
    #       namespaceSelector: projectcalico.org/name == 'monitoring'
    #   External Prometheus (VM, other cluster, SaaS):
    #     prometheusRule:
    #       nets:
    #         - 192.168.10.42/32
    #   Label-based:
    #     prometheusRule:
    #       selector: role == 'prometheus'
    prometheusRule: {}

  ######################################
  ##      Capacity/Affinity           ##
  ######################################

  replicaCount: 1
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 110
    targetMemoryUtilizationPercentage: 300

  podDisruptionBudget:
    enabled: true
    minPods: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  ######################################
  ##      Environment                 ##
  ######################################

  nameOverride: ""
  fullnameOverride: ""

  #JavaOpts and executions-limits
  javaOpts: "-XX:+UseG1GC -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCInterval=300000 -XX:MaxRAMPercentage=75 -Djdk.virtualThreadScheduler.parallelism=64 -Djava.security.properties=/etc/fusion-java-security/java.security"
  enable_legacy_tls: false
  # max_executions_limit number of parallel executions allowed
  max_executions_limit: "20"
  # critical_memory_buffer minimum amount of free memory (in MiB) available before orchestration can commence
  critical_memory_buffer: "64"
  throw_exception_on_fail: "false"
  stale_process_interval: "30m"
  # Ceiling on how long a cached OCSP verdict stays usable, for the Certificates component's Validate
  # Certificate action. Accepts "Nms", "Ns" or bare milliseconds.
  # An entry expires at the EARLIER of the OCSP response's nextUpdate and this value, so lowering it
  # shortens every entry — including those from a responder that supplies its own nextUpdate. Raising
  # it never extends an entry past the responder's nextUpdate.
  # Deliberately separate from pepServer.ocspCacheTTL: that cache covers the mTLS front door, one
  # bounded client set shared across all tenants, while this one is per tenant and per mode over
  # arbitrary user-supplied certificates, so its key space is unbounded. The two need independent
  # tuning. Keep in step with EnvironmentProperty.ocsp_cache_ttl, which carries the same default for
  # non-Helm contexts such as tests.
  # 0 and negative values are NOT a disable switch: they are rejected, and the orchestrator logs a
  # warning and falls back to the 86400s default. To make caching effectively inert, set a minimal
  # positive value such as "1ms" — each entry is then written and immediately expired.
  ocsp_cache_ttl: "86400s"
  QUARKUS_LOG_CONSOLE_LEVEL: "INFO"  # Console log level for inbound server and orchestrator
  max_payload_size_kbs: "20"
  heartbeat_time_interval_sec: "300"
  heartbeat_timeout_sec: "900"
  # websocket server settings
  websocket_server:
    enabled: true
    orchestrator_port: 1919
    max_frame_size: "1000000"
    max_message_size: "100000000"
    memoryCheck:
      open: false
      message: false
  #AWS Credentials
  # If aws.enabled is true, secrets.orchestratorAws must be configured
  aws:
    enabled: false

  # Encryption at Rest (EIPAAS-17841)
  # The Cluster Root Key is configured under encryption.encryptAtRest: 'aws' provider requires
  # kmsKeyArn and awsRegion, 'localcrk' provider requires localcrk.alias.
  encryptAtRest:
    enabled: false
    kekDurationMinutes: 720        # CRYPTO_KEK_DURATION: lifetime of each KEK before rotation
    dekDurationMinutes: 60         # CRYPTO_DEK_DURATION: lifetime of each in-memory DEK
    kekRotationPercentage: 10      # CRYPTO_KEK_ROTATION_PERCENTAGE: rotation check runs at this % of KEK lifetime (1-99)
    kekRotationIntervalMinutes: 0  # CRYPTO_KEK_ROTATION_INTERVAL: override rotation check interval (0 = derive from duration and percentage)

  #cidr_range block internal ip ranges (format exanple )0.73.0.0/16,172.21.0.0/16
  cidr_range: ""

  #SAP dependencies configuration
  sap_lib_directory: "false"
  sap_enabled: false

  hostPath:
    enabled: false
  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: []

