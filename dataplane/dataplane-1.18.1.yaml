    httpGet:
      path: /
      port: http
      scheme: HTTP
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 3

  # fluentbit readiness probe
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 10
    failureThreshold: 3

  # fluentbit startup probe
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 30
    failureThreshold: 3

  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: false
    minPods: 1

  dnsPolicy: ClusterFirst

  restartPolicy: Always

  schedulerName: default-scheduler

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
