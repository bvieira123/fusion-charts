######################################
##      Configuration               ##
######################################

# In order to install Fusion, you need to set acceptGeneralConditions to "yes":
# You hereby accept that the Axway Products and/or Services shall be governed exclusively by the Axway General Terms and Conditions located at Axway General Conditions,
# https://www.axway.com/sites/default/files/Legal_documents/License_general_conditions/Axway_General_Conditions_version_april_2014_eng_(France).pdf
# unless an agreement has been signed with Axway in which case such agreement shall apply.
acceptGeneralConditions: "yes"

# Unique identifier for your Fusion environment
appEnv: design
# clusterKey is obtained from the Control Plane User Interface
clusterKey: ""

# Hostname for your Fusion deployment
external_domain: "data-plane-design.gnosistech.com.br"
# The domain name for your control plane. Only used when deploying a shared Fusion.
ctlplane_domain: ""

# Prefix for envoy load balancer domain when deploying a shared Fusion: <shared_lb_prefix>.<external_domain>
shared_lb_prefix: "ha-lb"

sftp_server_port: "2222"

# Set to true to manage ConfigMaps separately to the helm chart deployment
#### WARNING!! ####
# Values set in configMaps are critical to the functionality of the application
# Names and values must be consistent with what is expected
# If these are not managed correctly, the application may not work as intended
externalConfigMaps: false

# AWS region for all AWS-dependent features (encryption at rest, component AWS SDK)
# Required by encryption at rest only when encryption.encryptAtRest.provider is 'aws'.
awsRegion: ""  # e.g. eu-west-1

######################################
##      Image                       ##
######################################

image:
  repository: docker.repository.axway.com/amplifyfusion-docker-prod
  # pullPolicy the image pull policy
  pullPolicy: IfNotPresent
  # imagePullSecrets - secret that stores credentials for access to a registry for docker images
  # This secret is the image pull secrets used by all the charts
  # Use your Axway credentials if pulling from the Axway repository
  # For a customer: create the secret:
  #      REGISTRY_USERNAME= # credentials from your service account
  #      REGISTRY_PASSWORD= # credentials from your service account
  #      REGISTRY_SERVER=docker.repository.axway.com
  #      kubectl create secret docker-registry ampint-docker-artifactory --docker-server="${REGISTRY_SERVER}" --docker-username="${REGISTRY_USERNAME}" --docker-password="${REGISTRY_PASSWORD}"
  # When zerotrust.enabled=true and secrets are managed externally, the secret must also exist in the SPIRE namespace
  # (setup.sh handles this automatically; for manual creation repeat the command with -n <spire-namespace>)
  imagePullSecrets:
  - name: axway-registry
  createPullSecret:
    dockerconfigjson: ""
  alpinetools:
    image:
      name: 1.18.1/alpine-tools
      tag: 1.6.2

  # ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
  initContainers:
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
multihost:
  enabled: false
  listeners:
    ssh:
      port: 22
      sftp:
        enabled: true
        hostPrefix: sftp-server
    tcp:
      http:
        enabled: true
        hostPrefix: http-server
      port: 80
    tls:
      api:
        enabled: true
        hostPrefix: api-server
      api_mtls:
        enabled: true
        hostPrefix: api-mtls-server
      https:
        enabled: true
        hostPrefix: https-server
      port: 443
      webhook:
        enabled: true
        hostPrefix: webhook-server
email:
  # SMTP server hostname - e.g. smtp.office365.com
  host: "email-smtp.us-east-1.amazonaws.com"
  # SMTP port - e.g. 587
  port: "587"
  useTls: true
  # Set to true if SMTP authentication is required
  authentication: true
  # Sender email address - e.g. myemail@example.com
  fromAddress: "admin@gnosistech.com.br"
  # Admin notification email - e.g. myadminemail@example.com
  adminAddress: "admin@gnosistech.com.br"
  # Support email address displayed to users - e.g. support@example.com
  supportAddress: "admin@gnosistech.com.br"

  # SMTP credentials secret
  credentials:
    name: "frommail"
    # set to true if managing secrets external to helm deployment
    existingSecret: true
    # values if not using existing secret:
    username: "AKIAVJZ7PDGTGVL6L6WL" # AWS SES SMTP username
    password: "" # AWS SES SMTP password

######################################
##      Secrets                     ##
######################################
# This block generates secrets that will be used by the other Helm charts

secrets:
  # Cluster identity - JWT secret and cluster ID
  # If not deploying a shared Fusion, do not set. These will be retrieved from your clusterKey.
  # When deploying a shared Fusion, these values can be retrieved from your control plane.
  clusterDetails:
    name: "cluster-details"
    existingSecret: true
    jwtSecret: ""
    clusterId: ""

  # Orchestrator AWS credentials - only required when orchestrator.aws.enabled is true
  orchestratorAws:
    name: "orchestrator-aws-credentials"
    existingSecret: false
    accessKey: "xxxxxxxxxxxx"
    secretKey: "xxxxxxxxxxx"

  # Inbound-worker AWS credentials - only required when inboundWorker.aws.enabled is true
  inboundWorkerAws:
    name: "inbound-worker-aws-credentials"
    existingSecret: false
    accessKey: "xxxxxxxxxxxx"
    secretKey: "xxxxxxxxxxx"

  # Datagrid (Valkey/Redis) credentials
  datagrid:
    name: "datagrid-credentials"
    # set to true if managing secrets external to helm deployment
    existingSecret: true
    password: "admin"

######################################
##      Storage                     ##
######################################

storage:
  # claimName a reference to the file share claim name
  claimName: sharedstorage-claim
  # volumeStorageName the volume name of the persistent fileshare
  volumeStorageName: fileshare-storage

  s3Payload: "false"

  # Common settings for persistence of data
  persistence:
    # claimRequestCapacity the claim's requested storage capacity size
    claimAccessMode: ReadWriteMany
    claimRequestCapacity: 5Gi
    volumeAccessMode: ReadWriteMany
    volumeCapacity: 5Gi
    volumeName: shared-volume
    volumeReclaimPolicy: Retain
  azfiles:
    azureStorageAccountKey: ""
    enabled: false
    existingSecret: false
    fileshareName: ""
    forceCloseHandles:
      enabled: false
      vmssManagedIdentityClientId: ""
    resourceGroup: ""
    secretName: azurefs-secret
    storageAccountName: ""
    storageClassName: managed-csi
  efs:
    enabled: false
    volumeHandle: ""
  nfs:
    enabled: false
    mode: csi
    mountOptions:
    - nfsvers=4.1
    path: /
    server: ""
    staticPvc: false
    storageClassName: ""
  pvc:
    claimAccessMode: ReadWriteMany
    claimRequestCapacity: ""
    enabled: false
    storageClass: ""
tls:
  # ---- Truststore ----
  truststore: truststore.jks
  # Password for the mTLS partner-certificate truststore (server_truststore_password). Deliberately
  # separate from certificate.password: the truststore file persists across cert rotations, so
  # this password must not rotate with the domain certificate. Leave empty to create the
  # 'truststore-password' secret external to the helm deployment.
  # 'truststore-password' secret should have 1 data entry with the key 'password'
  #
  # UPGRADE NOTE: this secret is new as of the chart version that introduced this value. On the
  # first upgrade where 'truststore-password' does not yet exist and this is left empty, the chart
  # auto-seeds it from the existing 'certificate-password' secret's current value (every
  # environment prior to this change effectively used that value for the truststore too) — no
  # manual action is required to upgrade. From that point on it is a fully independent secret:
  # rotating certificate-password afterward will not affect it, and it is never re-seeded on
  # subsequent upgrades. Set this value (or pre-create 'truststore-password') only if you want an
  # explicit, different value from day one rather than inheriting certificate-password's current one.
  truststorePassword: ""

  # ---- Domain Certificate ----
  # By default (manuallyCreated: true) you must supply a 'domain-certificate' secret yourself:
  #   kubectl create secret generic domain-certificate --from-file=keystore.p12=/path/to/cert
  # Set manuallyCreated: false to have cert-manager create and auto-renew the certificate instead.
  domainCertificate:
    # The key reference to the cert in the domain-certificate secret. If using cert-manager, leave as 'keystore.p12'
    name: "keystore.p12"
    # Set the password for your certificate, or leave empty and create 'certificate-password' secret external to helm deployment
    # A password is needed whether you create the certificate yourself or generate it using the cert-manager feature below
    # 'certificate-password' secret should have 1 data entry with the key 'password'
    password: ""
    # true (default) = you pre-create the 'domain-certificate' secret yourself; cert-manager is
    # NOT required and renders no Certificate CRD.
    # false = cert-manager issues and auto-renews the certificate using the fields below.
    # warning: if cert-manager is not installed already, the certificate CRD may not exist yet and your installation will be rejected
    manuallyCreated: true
    # cert-manager issuance duration. Maximum 8760h (1 year).
    rotationPeriod: 2190h # 3 months
    renewBefore: 168h # 1 week
    subject:
      # optional organizations to be used on the certificate
      organizations:
      - fusion
    rotationPolicy: "Always"
    # Certificate key algorithm. One of RSA, ECDSA, Ed25519.
    algorithm: "RSA"
    # Key size in bits. Applies to RSA (2048/4096/8192) and ECDSA (256/384/521).
    # Ignored for Ed25519 (fixed-size curve). 2048 matches this chart's historical default.
    keySize: 2048
    issuerRef:
      # name of the ClusterIssuer resource in your environment
      kind: ClusterIssuer
      name: letsencrypt-prod
  sshCertificate:
    # MODE 1 vs 2 vs 3 selector. false (default) = MODE 1 (shared TLS key).
    enabled: false
    # MODE 2 vs 3 selector (only when enabled: true). false = MODE 2 (cert-manager issues the key);
    # true = MODE 3 (you pre-create the ssh-domain-certificate secret; cert-manager not required).
    manuallyCreated: false
    # MODE 2 & MODE 3: keystore password (PKCS12) or passphrase (encrypted raw key).
    # Leave empty for an unencrypted raw key; either way the 'ssh-certificate-password'
    # secret must exist (pre-create it externally, key 'password', or set it here).
    password: ""
    # --- The following fields apply to MODE 2 only (cert-manager issuance);
    # SSH cert (X.509 wrapper) duration / renewal cadence. Maximum 8760h (1 year).
    # The SSH host key itself is not auto-rotated unless rotationPolicy is Always (see below).
    rotationPeriod: "8760h"
    # How early before expiry cert-manager renews the SSH cert. Must be < rotationPeriod.
    # Consistent with the TLS cert default (168h).
    renewBefore: "168h"
    # SSH host key rotation policy. DEFAULT Never — SSH clients pin the host key
    # (TOFU/known_hosts), so Always rotates the host key on renewal (~annually at 8760h)
    # and breaks EVERY SFTP client until they update known_hosts. Only set Always if you
    # have client-side known_hosts automation.
    # One of: Always, Never.
    rotationPolicy: "Never"
    # SSH host key algorithm. One of RSA, ECDSA, Ed25519. RSA is the default for maximum
    # compatibility with enterprise/legacy SFTP clients.
    algorithm: "RSA"
    # Key size in bits. Applies to RSA (2048/4096/8192) and ECDSA (256/384/521).
    # Ignored for Ed25519 (fixed-size curve).
    keySize: 4096
    subject:
      # optional organizations to be used on the certificate
      organizations:
      - fusion
    # cert-manager Issuer/ClusterIssuer for the SSH cert. Independent of
    # tls.domainCertificate.issuerRef (the TLS cert's issuer) — set separately if
    # you want the SSH cert issued by a different issuer.
    issuerRef:
      #name -the name of the ClusterIssuer resource in your environment
      kind: ClusterIssuer
      name: letsencrypt
  domainCertWatch:
    calicoNetpol:
      enabled: false
    enabled: false
    job_ttl: "43200"
    nameOverride: ""
    podSecurityContext:
      fsGroup: 1001
      supplementalGroups:
      - 1001
    podSecurityContextEnabled: true
    schedule: 0 4 * * *
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsGroup: 10020
      runAsNonRoot: true
      runAsUser: 10010
      seccompProfile:
        type: RuntimeDefault
    serviceAccount:
      annotations: {}
      enabled: true
      name: domain-cert-watch
      preexisting: false
encryption:
  encryptAtRest:
    kmsKeyArn: ""
  kms:
    aws:
      keyTags: {}
      region: ""
    type: none
      # Authentication: IRSA only — no static credentials.
      # Annotate each consuming component's ServiceAccount with its IAM role ARN.

######################################
##      Logging                     ##
######################################

logging:
  # Set to false if fluent bit daemon should tap to the log stream of the pods (i.e. var/log/containers).
  # Set it to false for SaaS deployments where fluent bit is allowed to run with root user permission.
  # Keep as true for custom managed environments where file system logging is used instead of console logging.
  logFileEnabled: true
  # This setting controls the log output format.
  # If true, logs are written in JSON format.
  # If false, logs are written in plain text format.
  logJsonEnabled: true

######################################
##      OpenTelemetry               ##
######################################

openTelemetry:
  enabled: false
  exporter:
    grpc:
      enabled: false
      endpoint: '{{ if .Values.fluentBit.enabled }}{{ include "fluent-bit.urlScheme" . }}://{{ include "fluent-bit.appName" . }}:4317{{ end }}'
    http:
      enabled: false
      endpoint: '{{ if .Values.fluentBit.enabled }}{{ include "fluent-bit.urlScheme" . }}://{{ include "fluent-bit.appName" . }}:4318/v1/traces{{ end }}'
    log:
      enabled: false
envoy:
  enabled: true

  ######################################
  ##      Image                       ##
  ######################################

  image:
    name: 1.18.1/envoyproxy
    tag: distroless-v1.39.1-axway-1

  ######################################
  ##      Service                     ##
  ######################################

  service:
    type: ClusterIP
    ports:
    - name: ssh
      protocol: TCP
      port: 9022
      targetPort: 2222
    - name: apim
      protocol: TCP
      port: 4443
      targetPort: 4443
    - name: apim-mtls
      protocol: TCP
      port: 5443
      targetPort: 5443
    - name: webhook
      protocol: TCP
      port: 443
      targetPort: 8443
    - name: https
      protocol: TCP
      port: 9443
      targetPort: 9443
    - name: http
      protocol: TCP
      port: 9080
      targetPort: 9080

  ######################################
  ##   Routes - Openshift Specific    ##
  ######################################

  # In order to use routes multihost must first be enabled in the parent chart
  # Enabling route will then create an openshift route for that traffic type using the multihost format.
  #      This will be: <multihost.listeners.tls.webhook.hostPrefix>.<external_domain>.<external_domain>
  #      (example: apim.your-fusion-domain.com)

  route:
    http:
      enabled: false
    https:
      enabled: false
    webhook:
      enabled: false
    api:
      enabled: false
    api_mtls:
      enabled: false
    sftp:
      enabled: false

  ######################################
  ##      Probes                      ##
  ######################################

  # envoy startup probe
  startupProbe:
    httpGet:
      path: /started
      port: internal
    failureThreshold: 180
    periodSeconds: 1
    initialDelaySeconds: 30
    timeoutSeconds: 1
    successThreshold: 1

  # envoy liveness probe
  livenessProbe:
    httpGet:
      path: /
      port: admin
    initialDelaySeconds: 60
    periodSeconds: 120
    timeoutSeconds: 30
    failureThreshold: 3
    successThreshold: 1

  # envoy readiness probe
  readinessProbe:
    httpGet:
      path: /ready
      port: admin
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 3
    successThreshold: 1

  # Time to wait for Kubernetes to propagate readiness failure and remove pod from service endpoints
  preStopSleepSeconds: "40s"
  # Total time k8s will allow for shutdown
  terminationGracePeriodSeconds: 3600
  # Maximum time to wait for draining Envoy - This value should be <= (terminationGracePeriodSeconds - preStopSleepSeconds)
  maxDrainDurationSeconds: "3540s"
  # Interval between shutdown assessment
  gracefulShutdownPollIntervalSeconds: "5s"

  ######################################
  ##      Security                    ##
  ######################################

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  #serviceaccount for envoy
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "envoy"
    automountServiceAccountToken: true

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################

  calicoNetpol:
    enabled: false
    # reference the targets the envoy is allowed to reach
    outboundRule:
      # use this to reference a (preexisting) networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidre here
    # reference the source IPs allowed into envoy
    subnetEntityRule:
      # use this to reference a (preexisting) networkset
      selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 10.0.0.0/24 # put your subnet cidr here

  ######################################
  ##      Capacity/Affinity           ##
  ######################################

  replicaCount: 1
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: false
    minPods: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  files: {}
  templates: {}

  ######################################
  ##      Environment                 ##
  ######################################

  # The proxy admin port is not externally accessible by default, override this to
  # true in order to invoke the proxy admin APIs
  exposeProxyAdminPort: false
  # Override this if exposeProxyAdminPort=true and a different port is required for the proxy admin APIs.
  proxyAdminPort: 9901

  adminPorts:
    admin:
      containerPort: 9901
      protocol: TCP
    internal:
      protocol: TCP
      containerPort: 9902
    drain:
      protocol: TCP
      containerPort: 9903

  ports:
    apim:
      protocol: TCP
      containerPort: 4443
    apim-mtls:
      protocol: TCP
      containerPort: 5443
    webhook:
      protocol: TCP
      containerPort: 8443
    https:
      protocol: TCP
      containerPort: 9443
    http:
      protocol: TCP
      containerPort: 9080
    ssh:
      protocol: TCP
      containerPort: 2222

  timeouts:
    # Loadbalancer timeout higher than request to allow for clean closing of request.
    loadbalancer: 3700
    maxDuration: 3600s
    idleTimeout: 3600s
    connectTimeout: 15s

  command:
  - /usr/local/bin/envoy

  argsTemplate: |-
    - -l
    - $(LOGLEVEL)
    - -c
    - /config/envoy.yaml
    {{- if .Values.logging.logJsonEnabled }}
    - --log-format
    - $(LOGFORMAT)
    {{- end }}

  logLevel: info
  logFormat: '{"timestamp":"%Y-%m-%dT%T.%F","process_id":"%P","thread_id":"%t","level":"%l","loggerName":"%n","source_file":"%s","source_line":"%#","message":"%v"}'
  ######################################
  ##      Lifecycle                   ##
  ######################################

  lifecycle:
    preStop:
      httpGet:
        path: /drain
        port: drain
        scheme: HTTP

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: LOG_LEVEL
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: []

######################################
##      Inbound-Worker              ##
######################################

inboundWorker:
  enabled: true

  ######################################
  ##      Image                       ##
  ######################################

  image:
    name: 1.18.1/inbound-worker
    buildTag: 1.18.1

  ######################################
  ##      Service                     ##
  ######################################

  service:
    type: ClusterIP
    ports:
    - name: internal
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: sse
      protocol: TCP
      port: 7080
      targetPort: 7080
    - name: openapi
      protocol: TCP
      port: 9080
      targetPort: 9080
    - name: ssh
      protocol: TCP
      port: 2222
      targetPort: 2222
    - name: service
      protocol: TCP
      port: 9443
      targetPort: 9443

  sftpService:
    enabled: false
    type: NodePort
    ports:
    - name: ssh
      protocol: TCP
      port: 9022
      targetPort: 9022
      nodePort: 32222


  ######################################
  ##      Persistence                 ##
  ######################################
  #EBS_hostPath
  ebs_root: "/transaction-data"
  txn_log_base_path: "/transaction-logs"

  #EFS_Filesystem
  efs_txn_log_path: "/efs/transaction-logs"

  ######################################
  ##      Probes                      ##
  ######################################

  #inbound worker startupProbe
  startupProbe:
    httpGet:
      path: /q/health/started
      port: management
    initialDelaySeconds: 10
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
    successThreshold: 1

  #inbound worker livenessProbe
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  #inbound worker readinessProbe
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  preStopSleepSeconds: "40s"
  terminationGracePeriodSeconds: 3600

  ######################################
  ##      Security                    ##
  ######################################

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  #serviceaccount for inbound-worker
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "inbound-worker"
    automountServiceAccountToken: true

  hostPath:
    enabled: false

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################

  # Use the following block if you have Calico and want to use its network policies
  # You will need the Calico API server to be installed as well
  calicoNetpol:
    enabled: false
    # reference the targets the inbound-worker is allowed to reach
    outboundRule: {}
      # use this to reference a (preexisting) networkset
      #selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidre here
    # managementRule: source allowed to reach the management port (8181) for kubelet probes.
    # Use a net (CIDR) covering the cluster node IP range, or a Calico selector.
    # NOTE: leaving empty ({}) renders `source: {}` → port 8181 OPEN to all cluster traffic.
    # Example:
    #   managementRule:
    #     nets:
    #       - 10.0.0.0/16    # VPC CIDR containing all cluster nodes
    managementRule: {}
    # prometheusRule: Calico EntityRule selecting the Prometheus instance(s) allowed to scrape
    # /q/metrics on port 8181. Empty ({}) = Prometheus blocked.
    # Examples:
    #   In-cluster Prometheus:
    #     prometheusRule:
    #       namespaceSelector: projectcalico.org/name == 'monitoring'
    #   External Prometheus (VM, other cluster, SaaS):
    #     prometheusRule:
    #       nets:
    #         - 192.168.10.42/32
    #   Label-based:
    #     prometheusRule:
    #       selector: role == 'prometheus'
    prometheusRule: {}

  ######################################
  ##      Capacity/Affinity           ##
  ######################################

  replicaCount: 1
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  resources:
    limits:
      cpu: 1000m
      memory: 1536Mi
    requests:
      cpu: 150m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 375

  podDisruptionBudget:
    enabled: false
    minPods: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  ######################################
  ##      Environment                 ##
  ######################################

  javaOpts: "-XX:+UseG1GC -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCInterval=300000 -XX:MaxRAMPercentage=75 -Djava.security.properties=/etc/fusion-java-security/java.security"
  # Date after which missed events will be rescheduled. Should be in Zulu time.
  # The expected format is YYYY-MM-DDTHH:MMZ, for example "2025-11-13T12:00Z"
  only_reschedule_missed_events_newer_than: ""
  stale_process_interval: "30m"
  QUARKUS_LOG_CONSOLE_LEVEL: "INFO"
  max_payload_size_kbs: "50"
  heartbeat_time_interval_sec: "300"
  heartbeat_timeout_sec: "900"
  leader_lease_duration: "6"
  leader_lease_renew_period: "4"
  leader_lease_retry_period: "1"
  delegate_inoperative_pod_events_interval_sec: "2s"
  enable_legacy_tls: "false"
  # Mail trigger interval in seconds for inbound worker web socket connection failure
  mailTriggerInterval: 300
  datagrid_subscriptions_per_connection: 20               # Number of subscriptions allowed per connection in the Valkey client
  datagrid_subscription_connection_pool_size: 100         # Size of the subscription connection pool in the Valkey client

  # If aws.enabled is true, secrets.inboundWorkerAws must be configured
  aws:
    enabled: false

  # Encryption at Rest (EIPAAS-17841)
  # The Cluster Root Key is configured under encryption.encryptAtRest: 'aws' provider requires
  # kmsKeyArn and awsRegion, 'localcrk' provider requires localcrk.alias.
  encryptAtRest:
    enabled: false
    kekDurationMinutes: 720        # CRYPTO_KEK_DURATION: lifetime of each KEK before rotation
    dekDurationMinutes: 60         # CRYPTO_DEK_DURATION: lifetime of each in-memory DEK
    kekRotationPercentage: 10      # CRYPTO_KEK_ROTATION_PERCENTAGE: rotation check runs at this % of KEK lifetime (1-99)
    kekRotationIntervalMinutes: 0  # CRYPTO_KEK_ROTATION_INTERVAL: override rotation check interval (0 = derive from duration and percentage)

  #SFTP and HTTPS Connections
  sftp_enable: "true"
  http_enable: "true"
  https_enable: "true"
  api_enable: "true"
  api_mtls_enable: "true"

  # Until mTLS enforcement is configured in Envoy we need to _not_ terminate TLS to avoid client cert prompt. (EIPAAS-4353)
  http_tls_termination: "false"

  nameOverride: ""
  fullnameOverride: ""

  #SAP dependencies configuration
  sap_lib_directory: "false"
  sap_enabled: false

  # New salesforce event configuration
  salesforce:
    #  <host>{:<port>} Pub/Sub API Endpoint
    #  default:  api.pubsub.salesforce.com  (port 443 or 7443)
    pubsub_api_url: ""
    # Retry configuration:
    #  - initial backoff duration in ISO 8601 format
    #  default: PT1M
    retry_initial_backoff_duration: ""
    #  - max backoff duration in ISO 8601 format
    #  default: PT5M
    retry_max_backoff_duration: ""
    #  - Comma separated list of GRPC status codes to retry
    #  default: INTERNAL,UNAVAILABLE,ABORTED,FAILED_PRECONDITION,RESOURCE_EXHAUSTED
    retry_status_code_list: ""
    # gRPC keepalive configuration:
    #  - interval between HTTP/2 keepalive pings in seconds
    #  default: 60
    grpc_keepalive_time_seconds: ""
    #  - timeout to wait for a keepalive ping response before closing the connection, in seconds
    #  default: 10
    grpc_keepalive_timeout_seconds: ""
    # Idle stream watchdog:
    #  - reconnect if no FetchResponse received for this many seconds (0 = disabled)
    #  default: 300
    idle_watchdog_threshold_seconds: ""

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: LOG_LEVEL
  #     value: DEBUG
  # @schema
  # type: array
