    #Number of seconds a job should live after it is finished.
    job_ttl: "3600"

######################################
##             Valkey               ##
######################################

valkey:
  enabled: true

  client:
    # deployment_model - which Redisson connector the datagrid client uses:
    #   standalone - single server, no cluster protocol
    #   clustered  - Valkey Cluster protocol (CLUSTER NODES/SLOTS)
    # Leave empty to auto-select: for the internal Valkey above, standalone when
    # valkey.internal.clusterSize:1 (cluster-enabled no), clustered otherwise; for an
    # external/managed Valkey, always clustered (the only mode supported there) unless set
    # explicitly.
    deployment_model: ""
    #subscription_mode - primary_only, replica_only - subscriptions to primary nodes only is default.
    subscription_mode: primary_only
    #read_mode - replica_first, primary_only, primary_and_replica - read from primary nodes only is default.
    read_mode: primary_only
    # security_mode controls how the Valkey client establishes connections:
    #   NONE     - plaintext, no TLS (development/testing only)
    #   ONLY_CA  - TLS, validates CA certificate only (no hostname check)
    #   STRICT   - TLS, validates CA certificate and hostname (standard production TLS)
    #   MTLS     - mutual TLS via SPIRE; falls back to STRICT when SPIRE is not active
    # Leave empty to auto-select: MTLS when SPIRE is enabled, NONE otherwise
    security_mode: ""

    datagrid_username: default
    datagrid_primary_connection_pool_min: 12           # Minimum number of connections maintained in the primary Valkey connection pool
    datagrid_primary_connection_pool_max: 64           # Maximum number of connections allowed in the primary Valkey connection pool
    datagrid_replica_connection_pool_min: 12           # Minimum number of connections maintained in the replica Valkey connection pool
    datagrid_replica_connection_pool_max: 64           # Maximum number of connections allowed in the replica Valkey connection pool
    datagrid_worker_threads: 32                        # Number of worker threads configured in the datagrid client
    datagrid_idle_connection_timeout_millis: 30000     # Timeout in milliseconds before idle connections are closed (10 seconds)
    datagrid_cluster_connect_timeout_millis: 10000     # Timeout in milliseconds for establishing cluster connections (10 seconds)
    datagrid_response_timeout_millis: 20000            # Timeout in milliseconds for waiting on command responses (10 seconds)
    datagrid_number_of_retries: 3                      # Number of retry attempts for failed operations before giving up
    datagrid_retry_interval_millis: 5000               # Delay in milliseconds between retry attempts (5 seconds)

    datagrid_subscriptions_per_connection: 5               # Number of subscriptions allowed per connection in the Valkey client
    datagrid_subscription_connection_pool_size: 50         # Size of the subscription connection pool in the Valkey client
    datagrid_subscription_connection_min_idle_size: 5      # Minimum idle connection pool size maintained in the subscription connections pool
    datagrid_subscription_connection_timeout_millis: 7500  # Timeout in milliseconds for subscription connections (i.e 7.5 seconds)

  hosts:
  - hostname: valkey-headless
    port: "6379"

  external:
    enabled: false
    ######################################
    ##      Network Policies            ##
    ######################################

    # Use the following block if you have Calico and want to use its network policies
    # You will need the Calico API server to be installed as well
    calicoNetpol:
      enabled: false
      outboundRule:
        # use this to reference a (preexisting) networkset
        selector: role == 'any-address'
        # or uncomment this to directly reference IP cidr instead
        #nets:
        #  - 0.0.0.0/0 # put your subnet cidre here

  internal:
    enabled: true
    ######################################
    ##      Network Policies            ##
    ######################################

    # Use the following block if you have Calico and want to use its network policies
    # You will need the Calico API server to be installed as well
    calicoNetpol:
      enabled: false
      # prometheusRule: Calico EntityRule selecting the Prometheus instance(s)
      # allowed to scrape /q/metrics on port 8181 (see valkey.internal.metrics
      # below). Empty ({}) = Prometheus blocked
      # Examples:
      #   In-cluster Prometheus:
      #     prometheusRule:
      #       namespaceSelector: projectcalico.org/name == 'monitoring'
      #   External Prometheus (VM, other cluster, SaaS):
      #     prometheusRule:
      #       nets:
      #         - 192.168.10.42/32
      #   Label-based:
      #     prometheusRule:
      #       selector: role == 'prometheus'
      prometheusRule: {}

    ######################################
    ##      Metrics                     ##
    ######################################
    metrics:
      # Set to false if nothing scrapes this endpoint
      enabled: true

    ######################################
    ##      Cluster Configuration       ##
    ######################################
    clusterSize: 1                    # Total nodes in cluster (masters + replicas)
    replicasPerMaster: 0              # Number of replicas per master

    # How stale (seconds) a replica's ACK may be before it stops counting toward Valkey's own
    # min-replicas-to-write write-fence - a data-plane self-fence, independent of the
    # controller's Kubernetes-based STONITH. Only takes effect when subQuorumFailoverRequired;
    # default 10 matches Valkey's own min-replicas-max-lag default, not derived from
    # primaryHealthCheck.* (a different timing budget - replication lag vs. detection).
    minReplicasMaxLagSeconds: 10

    # How long a newly-rolled Valkey pod must stay Ready before the rollout advances - guards
    # against a crash-looping image taking out the last node. Only rendered for sub-quorum
    # topologies; native-quorum keeps its existing rollout pacing.
    minReadySeconds: 10

    # How long pre-stop.sh's wait_for_graceful_handoff() waits for this node to actually stop
    # being master before giving up and continuing shutdown anyway. Needed because a CLUSTER
    # FAILOVER's OK response only means the request was accepted, not that the (asynchronous)
    # handoff completed. Only relevant when subQuorumFailoverRequired.
    gracefulHandoffTimeoutSeconds: 10


    ######################################
    ##      Image                       ##
    ######################################

    image:
      name: 1.18.1/valkey
      buildTag: 8.1.10-alpine3.24-axway-6

    ######################################
    ##      Environment                 ##
    ######################################
    #name overrides
    nameOverride: ""
    fullnameOverride: ""
    #20 seconds (time before marking a node as failed)
    clusterNodeTimeout: 20000
    #Persistence storage folder
    valkeyDir: /data
    #Will return errors when memory limit reached instead of evicting keys
    maxMemoryPolicy: noeviction

    logLevel: notice
    logFormat: logfmt
    logTimeStampFormat: iso8601

    ######################################
    ##      Env                         ##
    ######################################
    # Provide environment variables or override default application.properties
    # Define key values in form of name and value, e.g.:
    # env:
    #   - name: LOG_LEVEL
    #     value: DEBUG
    # @schema
    # type: array
    # items:
    #   oneOf:
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         value:
    #           type: string
    #       required: [name, value]
    #       additionalProperties: false
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         valueFrom:
    #           type: object
    #       required: [name, valueFrom]
    #       additionalProperties: false
    # @schema
    env: []

    ######################################
    ##      Persistence                 ##
    ######################################
    persistence:
      #claimTemplateRequestStorage storage request size for the claim template
      claimTemplateRequestStorage: 2Gi
      #claimTemplateStorageClass class that will dynamically create storage on desired cloud platform
      #For AWS set this value to gp3
      #For Azure set this value to managed-csi
      claimTemplateStorageClass: ""
      #claimTemplateName name of the claim for valkey storage
      claimTemplateName: valkey-data
      #claimTemplateAccessModes access mode for claim template
      claimTemplateAccessModes: ReadWriteOnce
      #Append-only file logging is on for durability - set to "no" to disable
      appendonly: "yes"
      # RDB snapshotting configuration
      # Don't define or set rdbSnapshots to empty array [] to disable RDB snapshots entirely
      # Each entry defines: save after X seconds if at least Y keys changed
      rdbSnapshots:
      - seconds: 900
        keyChanges: 1
      - seconds: 300
        keyChanges: 10
      - seconds: 60
        keyChanges: 10000

      ######################################
      ##      Log Rotation                ##
      ######################################
      logRotate:
        # How often to check whether the log needs rotating.
        # @schema
        # enum: [15m, 30m, hourly, 6h, 12h, daily]
        # @schema
        frequency: "15m"
        # Minimum size of the log file before it gets rotated
        size: 10M # rotate when log file reaches 10MB

        securityContext:
          # @schema
          # type: [string, integer, null]
          # @schema
          runAsUser: 10010
          # @schema
          # type: [string, integer, null]
          # @schema
          runAsGroup: 10020
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL

        podSecurityContextEnabled: true
        podSecurityContext:
          supplementalGroups:
          - 1001
          # @schema
          # type: [string, integer, null]
          # @schema
          fsGroup: 1001

    ######################################
    ##      Probes                      ##
    ######################################
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 12
      successThreshold: 1
      failureThreshold: 20

    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      successThreshold: 1
      failureThreshold: 3

    terminationGracePeriodSeconds: 120

    ######################################
    ##      Security                    ##
    ######################################

    podSecurityContextEnabled: true

    podSecurityContext:
      supplementalGroups:
      - 1001
      # @schema
      # type: [string, integer, null]
      # @schema
      fsGroup: 1001

    securityContext:
      # @schema
      # type: [string, integer, null]
      # @schema
      runAsUser: 10010
      # @schema
      # type: [string, integer, null]
      # @schema
      runAsGroup: 10020
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL

    #serviceaccount for valkey
    serviceAccount:
      enabled: true
      # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
      preexisting: false
      annotations: {}
      name: "valkey"
      automountServiceAccountToken: true

    podAnnotations: {}

    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

    resources:
      limits:
        cpu: 250m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi


    # Valkey pods should run on their own dedicated nodes, and no two Valkey pods should ever
    # share a node - losing one node must never be able to take out more than one replica.
    # Left empty here since the actual taints/labels are customer-specific: use
    # nodeSelector/tolerations to target your dedicated Valkey nodes, and uncomment (or adapt)
    # the required podAntiAffinity below to enforce the one-pod-per-node rule.
    nodeSelector: {}
    tolerations: []
    affinity: {}
    #  podAntiAffinity:
    #    requiredDuringSchedulingIgnoredDuringExecution:
    #      - labelSelector:
    #          matchLabels:
    #            app: valkey
    #            dplane: "valkey"
    #        topologyKey: "kubernetes.io/hostname"

    ######################################
    ##      Failover Controller         ##
    ######################################
    # Sub-quorum failover assistance for the internal Valkey above. Scoped under valkey.internal
    # since the controller STONITHs pods in its own namespace, so it can only ever manage
    # Valkey installed by this release - never an external/managed Valkey or another cluster's.
    # Only deployed when subQuorumFailoverRequired (fewer than 3 primaries); native quorum
    # failover handles 3+ primaries and none of this is installed.
    failoverController:

      ######################################
      ##      Image                       ##
      ######################################

      image:
        name: 1.18.1/valkey-failover-controller
        buildTag: 1.0.6

      # replicaCount intentionally not exposed - hardcoded to 2 in deployment.yaml. Leader
      # election, the required self-anti-affinity, and the PDB below all assume exactly 2;
      # 1 silently drops HA, and anything above 2 adds nothing under single-leader election.

      # Protects the controller's 2-replica HA during voluntary disruptions (node drain,
      # upgrade) - without this both replicas could be evicted at once, losing all failover
      # coverage. minPods:1 keeps at least one replica (and leader election) available.
      podDisruptionBudget:
        enabled: true
        minPods: 1

      # Ceiling for ControllerShutdownHandler's whole drain. Must be >= (2 x
      # terminationDrainSeconds) + a 10s Quarkus shutdown reserve, since the handler applies
      # that drain twice sequentially (an in-flight checkPrimary() tick, then a second-opinion
      # response) after releasing the Lease - the default Kubernetes grace period let the
      # kubelet SIGKILL mid-close otherwise. 60 leaves headroom above the ~30s worst case.
      terminationGracePeriodSeconds: 60

      # Bounded wait for one in-flight tick to finish before the mTLS identity source closes
      # (termination.controller.check-primary.drain.secs - deliberately shorter than a
      # worst-case STONITH tick; see the budget note in application.properties).
      terminationDrainSeconds: 10

      #serviceaccount for the controller
      serviceAccount:
        enabled: true
        preexisting: false
        annotations: {}
        name: "valkey-failover-controller"
        automountServiceAccountToken: true

      resources:
        limits:
          cpu: 1000m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi

      podSecurityContextEnabled: true
      podSecurityContext:
        supplementalGroups:
        - 1001
        # @schema
        # type: [string, integer, null]
        # @schema
        fsGroup: 1001

      securityContext:
        # @schema
        # type: [string, integer, null]
        # @schema
        runAsUser: 10010
        # @schema
        # type: [string, integer, null]
        # @schema
        runAsGroup: 10020
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
          - ALL

      # failoverController: startupProbe
      startupProbe:
        httpGet:
          path: /q/health/started
          port: 9000
        periodSeconds: 2
        timeoutSeconds: 2
        failureThreshold: 60
        successThreshold: 1

      # Probes run on the plain, unauthenticated Quarkus management port (9000), which is the
      # only port the controller publishes.
      livenessProbe:
        httpGet:
          path: /q/health/live
          port: 9000
        initialDelaySeconds: 15
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1

      readinessProbe:
        httpGet:
          path: /q/health/ready
          port: 9000
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1

      leaderElection:
        leaseName: valkey-primary-failover-lock
        # Carries the fence-heartbeat/graceful-shutdown annotations; leaseName above is used only by fabric8's LeaderElector.
        signalLeaseName: valkey-primary-failover-signal
        # Dedicated Lease for the leader/standby second-opinion handshake - kept apart from the two above so that traffic never shares a write surface.
        secondOpinionLeaseName: valkey-primary-failover-second-opinion
        leaseDurationSeconds: 15
        renewDeadlineSeconds: 10
        retryPeriodSeconds: 2

      # Single source of truth for PrimaryHealthMonitor's cadence/threshold and the primary's
      # self-fencing grace period (fenceGraceSeconds) - these used to drift apart, now derive
      # from one block. fenceSafetyMarginSeconds lives here (same timing budget) even though
      # lease-watchdog.sh, not the controller, consumes it.
      primaryHealthCheck:
        intervalSeconds: 5
        unhealthyThreshold: 3
        fenceSafetyMarginSeconds: 5

        # Bounded poll timeout PrimaryHealthMonitor waits, after force-deleting the old primary's
        # pod (STONITH), for it to stop answering PING before proceeding to TAKEOVER anyway. Kept
        # short (STONITH is a fast, decisive action, not a crash-detection backstop).
        stonithConfirmTimeoutSeconds: 20

        # Bound (seconds) within which the master watchdog's Lease heartbeat
        # annotation (lease-watchdog.sh) is considered live; ~5x the watchdog's 2s loop interval.
        fenceHeartbeatStaleThresholdSeconds: 10

        # Bound (seconds) within which pre-stop.sh's graceful-shutdown signal
        # (Lease annotation) is considered fresh enough to fast-track a coordinated CLUSTER
        # FAILOVER; a few multiples of intervalSeconds so it survives at least one missed tick.
        gracefulShutdownStaleThresholdSeconds: 15

        # How fresh a replica's reported master-link age must be to confirm the primary is
        # still live. Kept no higher than this block's own detection window (unhealthyThreshold
        # x intervalSeconds, ~15s) and well below Valkey's repl-timeout default of 60s.
        secondOpinionFreshnessThresholdSeconds: 10

        # Bound (seconds) the leader polls for a standby controller's cross-controller
        # second-opinion response before giving up and proceeding to STONITH; independent of
        # stonithConfirmTimeoutSeconds above.
        secondOpinionRequestTimeoutSeconds: 10

        # Cap on consecutive cycles a replica's own INFO replication self-report may veto
        # STONITH for the same primary - master_link_status is self-reported, so an uncapped
        # veto lets a compromised/stale replica block failover of a genuinely dead primary
        # forever. Once spent, the controller logs loudly and proceeds to STONITH anyway.
        maxReplicaVetoCycles: 3

      podAnnotations: {}
      # Same requirement as valkey.internal.affinity above: controller pods should run on their
      # own dedicated nodes, and no two replicas should ever share a node - the controller only
      # deploys in a real HA topology (>=2 nodes), so losing one node must never take out both
      # replicas at once. Left empty since taints/labels are customer-specific: use
      # nodeSelector/tolerations to target your dedicated nodes, and uncomment (or adapt) the
      # required podAntiAffinity below to enforce one-pod-per-node.
      nodeSelector: {}
      tolerations: []
      affinity: {}
      #  podAntiAffinity:
      #    requiredDuringSchedulingIgnoredDuringExecution:
      #      - labelSelector:
      #          matchLabels:
      #            app: valkey-failover-controller
      #            dplane: "valkey-failover-controller"
      #        topologyKey: "kubernetes.io/hostname"

      # Use the following block if you have Calico and want to use its network policies
      # You will need the Calico API server to be installed as well
      calicoNetpol:
        enabled: false
        # managementRule: source allowed to reach the management port (9000) for kubelet probes.
        # Use a net (CIDR) covering the cluster node IP range, or a Calico selector.
        # NOTE: leaving empty ({}) renders `source: {}` -> port 9000 OPEN to all cluster traffic.
        # Example:
        #   managementRule:
        #     nets:
        #       - 10.0.0.0/16    # VPC CIDR containing all cluster nodes
        managementRule: {}

#################################################
# Zero-trust activation
#################################################
# Zero-trust is gated by `zerotrust.enabled`. When true, the chart deploys the configured
# identity provider and injects workload-identity material into the dataplane components.
zerotrust:
  # @schema
  # default: false
  # type: boolean
  # description: If true, activate zero-trust and deploy the configured identity provider for the data plane components.
  # @schema
  enabled: false

  # provider selects which identity provider implementation to deploy.
  # @schema
  # enum: [spire]
  # description: Workload identity provider implementation.
  # @schema
  provider: spire

  # managedLabel is the Kubernetes label key stamped on every dataplane Pod managed by the
  # active zero-trust provider.
  managedLabel: zerotrust.axway/managed

  ################################################
  ##  Provider-specific configuration          ##
  ################################################
  # Configuration consumed by the provider selected via `zerotrust.provider`.
  providers:
    spire:
      # namespace is the Kubernetes namespace where SPIRE server and agent resources are installed.
      # All dataplanes in the same cluster share this single SPIRE installation.
      namespace: spire

      # preexisting controls whether SPIRE resources are created by this release.
      # Set to false (default) for the first dataplane install — SPIRE resources will be created.
      # Set to true for any subsequent dataplane install in the same cluster — SPIRE resources
      # already exist and this release will only deploy the dataplane components.
      # @schema
      # default: false
      # type: boolean
      # description: If true, skip creating SPIRE resources — they already exist from a prior dataplane install in this cluster.
      # @schema
      preexisting: false

      # dataplaneLabel is the Kubernetes label key stamped on dataplane namespaces and read by the
      # spire-registrar to discover which namespaces to watch. Both the namespace hook and the
      # registrar sidecar use this value — changing it here keeps them in sync.
      dataplaneLabel: "zerotrust.axway/dataplane"

      # labelNamespaceHook controls whether a pre-install Job is deployed to label the dataplane
      # namespace with <dataplaneLabel>=true. Set to false on clusters where the hook
      # pod cannot reach the Kubernetes API server (e.g. EKS with strict Gatekeeper/network policies).
      # When disabled, label the namespace manually before install:
      #   kubectl label namespace <namespace> <dataplaneLabel>=true --overwrite
      labelNamespaceHook:
        enabled: true
        calicoNetpol:
          # Enable on clusters with Calico global network policies that block hook pod egress
          # (e.g. EKS with restrictive Calico policies). Allows hook pod to reach the Kubernetes API server.
          enabled: false
        podSecurityContextEnabled: true
        podSecurityContext:
          fsGroup: 1000
          supplementalGroups: [1000]
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      # Must be unique per cluster to prevent identity collisions.
      clusterName: amplify-fusion-cluster

      # The trust domain for SPIRE install.
      trustDomain: zerotrust.internal

      caSubject:
        # Country for SPIRE server CA
        country: US
        # Organization for SPIRE server CA
        organization: Internal
        # Common Name for SPIRE server CA
        commonName: zerotrust-ca.internal

      ################################################
      ##  Workload identity delivery               ##
      ################################################
      # How SPIRE delivers identity material to workload pods (Workload API on a Unix domain
      # socket via hostPath). A file-based or sidecar-based provider would have a completely
      # different shape here.
      workload:
        # socketPath: in-container path the spire-agent listens on.
        socketPath: /run/spire/sockets/spire-agent.sock
        # socketHostPath: directory on the node where the Workload API socket lives.
        socketHostPath: /run/spire/sockets
        # volumeName: Kubernetes volume name for the hostPath mount injected into dataplane pods.
        volumeName: workload-identity-socket
        # mountPath: in-pod path read by the Java SDK and Envoy. Must match what those clients expect.
        mountPath: /spire-agent-sockets
        # waitInitContainer: gate dataplane Pod start until the agent socket is healthy.
        waitInitContainer:
          enabled: true

      ################################################
      ##  SPIRE Tools                              ##
      ################################################
      # spire-tools is the helper image (wait-for-agent.sh, spire-cert-refresh.sh) bundled with
      # the chart. Used as an init container by most dataplane components, and as a sidecar by
      # components that need PEM files on disk (e.g. fluent-bit).
      tools:
        image:
          name: 1.18.1/spire-tools
          buildTag: "1.15.3-axway-1"
        agentReadiness:
          timeoutSeconds: 120
        certRefresh:
          checkIntervalSeconds: 60
          renewBeforeExpirySeconds: 300
        # securityContext applied to the wait-for-workload-identity init container.
        # Matches the hardened defaults the dataplane components use.
        securityContext:
          runAsUser: 10010
          runAsGroup: 10020
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 1m
            memory: 48Mi
          limits:
            cpu: 100m
            memory: 128Mi

      ################################################
      ##  SPIRE Server                             ##
      ################################################
      server:
        enabled: true
        ################################################
        ##  SPIFFE/SPIRE trust anchor                ##
        ################################################
        # @schema
        # type: string
        # pattern: "^[1-9][0-9]*(m|h)$"
        # examples: [120m,12h]
        # description: TTL for spire-agent's own node SVID (default_x509_svid_ttl). Governs how long the agent can keep operating on a cached credential while spire-server is unreachable — keep this comfortably longer than any expected spire-server outage or rolling-upgrade window. Also the fallback TTL for workload entries when registrar.workloadSvidTTL is unset. Only minute/hour Go-duration units are accepted, and the value must be greater than zero.
        # @schema
        agentSvidTTL: 12h

        # @schema
        # type: string
        # pattern: "^[1-9][0-9]*(m|h)$"
        # examples: [24h,168h]
        # description: Intermediate CA TTL for the SPIRE server. Only minute/hour Go-duration units are accepted, and the value must be greater than zero.
        # @schema
        caTTL: 168h
        nameOverride: ""
        fullnameOverride: "spire-server"
        image:
          name: 1.18.1/spire-server
          buildTag: "1.15.3"
        serviceAccount:
          enabled: true
          preexisting: false
          # annotations — add the IRSA role ARN here when encryption.kms.type is aws.
          # IRSA lets the spire-server pod call AWS KMS without static credentials.
          # The IAM role must have KMS permissions.
          # Example:
          #   annotations:
          #     eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/spire-server-kms"
          annotations: {}
          name: "spire-server"
          # Disable the default automounted token — the statefulset uses an explicit projected
          # token with a 1-hour expiry replacing the default unlimited token for k8s API calls.
          automountServiceAccountToken: false
        # bundleConfigMapName is the ConfigMap the k8sbundle notifier writes the SPIRE CA bundle into.
        # The agent mounts this ConfigMap as its trust anchor (trust_bundle_path).
        bundleConfigMapName: "spire-bundle"
        persistence:
          size: 1Gi
          storageClass: ""
        podSecurityContextEnabled: true
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          supplementalGroups: [1000]
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        podAnnotations: {}
        calicoNetpol:
          # @schema
          # default: false
          # type: boolean
          # description: If true, deploy a Calico NetworkPolicy for spire-server. Requires the Calico CNI to be installed.
          # @schema
          enabled: false
          # inboundRule: source rule for spire-agent traffic on port 8081.
          # IMPORTANT: spire-agent uses hostNetwork:true — connections arrive from the NODE IP, not the
          # pod IP. A pod selector won't work. Use a net (CIDR) covering the cluster node IP range.
          # Example:
          #   inboundRule:
          #     nets:
          #       - 10.0.0.0/16    # VPC CIDR containing all cluster nodes
          inboundRule: {}
          # outboundRule: optional destination rule for external egress (e.g. AWS KMS endpoint).
          # DNS (port 53) and the Kubernetes API are always allowed and do not need to be included here.
          # Example for AWS KMS:
          #   outboundRule:
          #     nets:
          #       - 0.0.0.0/0      # or narrow to kms.<region>.amazonaws.com IP ranges
          outboundRule: {}
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /live
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        nodeSelector: {}
        tolerations: []
        affinity: {}

        ################################################
        ##  SPIRE KeyManager configuration           ##
        ################################################
        # @schema
        # type: object
        # properties:
        #   type:
        #     type: string
        #     enum: [disk, aws, memory]
        #     description: How spire-server stores its CA private key. disk for dev/RKE2, aws for EKS production, memory for ephemeral use with UpstreamAuthority.
        #   keyIdentifier:
        #     type: object
        #     properties:
        #       type:
        #         type: string
        #         enum: [file, value]
        #         description: How spire-server tracks its KMS key. file lets SPIRE create and manage the key; value references a pre-existing key ARN or alias.
        #       value:
        #         type: string
        #         description: KMS key ARN or alias. Required when keyIdentifier.type is value; ignored when file.
        # @schema
        keyManager:
          # type controls how spire-server stores its CA private key.
          # disk:   plaintext JSON on PVC (/run/spire/data/keys.json).
          #         No cloud KMS required. Use encryption.kms.type: none.
          #         SECURITY: the PVC must be backed by an encrypted StorageClass.
          # aws:    CA key generated and stored in AWS KMS HSM — never written to disk.
          #         Requires encryption.kms.type: aws and encryption.kms.aws.region.
          #         Requires IRSA role ARN in zerotrust.providers.spire.server.serviceAccount.annotations.
          # memory: CA key stored in RAM only — lost on pod restart, SPIRE re-generates on startup.
          #         Only safe when upstreamAuthority.type is not none — the upstream re-signs the
          #         new intermediate on each restart. No PVC or KMS required.
          type: disk    # disk | aws | memory
          keyIdentifier:
            # Only relevant when type is aws. Controls how spire-server tracks its KMS key.
            # file:  SPIRE creates the KMS key on first run and persists the ARN to
            #        /run/spire/data/kms-key-id. Pod restarts reuse the same key.
            #        Default — prevents key accumulation on restart.
            # value: Use a pre-existing KMS key ARN or alias (e.g. compliance-mandated key).
            #        SPIRE will not create a new key.
            type: file    # file | value
            value: ""     # required when type is value; ignored when type is file

        # upstreamAuthority controls whether SPIRE chains its CA to an external root CA.
        # When type is none (default), SPIRE is a self-signed root CA.
        # When set, SPIRE becomes an intermediate CA — its certificate is signed by the upstream.
        #
        # type options:
        #   none:        SPIRE self-signed root CA. No external dependency. Default.
        #   disk:        Root CA cert + key loaded from a Kubernetes Secret mounted into the pod.
        #                The customer pre-creates the Secret. The chart mounts it read-only.
        #                Use for on-prem when an existing CA cert/key is available.
        #   certManager: SPIRE submits a CertificateRequest to cert-manager. cert-manager signs
        #                it using the configured Issuer. Requires cert-manager installed in cluster.
        #                Use for on-prem when cert-manager manages the customer PKI.
        #   awsPca:      SPIRE submits a CSR to AWS Private Certificate Authority.
        #                Requires IRSA and an existing ACM PCA. Use for AWS environments where
        #                the customer requires certs to chain to their AWS-native PKI.
        # @schema
        # type: object
        # properties:
        #   type:
        #     type: string
        #     enum: [none, disk, certManager, awsPca]
        #     description: UpstreamAuthority plugin type.
        #   disk:
        #     type: object
        #     properties:
        #       secretName:
        #         type: string
        #         description: Name of the Kubernetes Secret containing cert (tls.crt) and key (tls.key).
        #   certManager:
        #     type: object
        #     properties:
        #       namespace:
        #         type: string
        #       issuerName:
        #         type: string
        #       issuerKind:
        #         type: string
        #         enum: [Issuer, ClusterIssuer]
        #       issuerGroup:
        #         type: string
        #   awsPca:
        #     type: object
        #     properties:
        #       region:
        #         type: string
        #       certificateAuthorityArn:
        #         type: string
        # @schema
        upstreamAuthority:
          type: none    # none | disk | certManager | awsPca

          # disk: mount a Kubernetes Secret containing the root CA cert and key.
          # The Secret must be pre-created in the spire namespace before install.
          # Required keys in Secret: tls.crt (CA certificate PEM), tls.key (CA private key PEM)
          # Example: kubectl create secret tls spire-upstream-ca -n spire \
          #            --cert=ca.crt --key=ca.key
          disk:
            secretName: ""    # name of the Secret in the spire namespace

          # certManager: SPIRE submits a CertificateRequest to a cert-manager Issuer.
          # cert-manager must be installed and the Issuer must exist before SPIRE starts.
          certManager:
            namespace: ""           # namespace where CertificateRequests are created
            issuerName: ""          # cert-manager Issuer or ClusterIssuer name
            issuerKind: Issuer      # Issuer | ClusterIssuer
            issuerGroup: cert-manager.io   # cert-manager API group; change only if using a custom Issuer controller

            # createBootstrapCA: when true the chart creates a self-signed Certificate (isCA=true)
            # and a CA ClusterIssuer named "spire-upstream-ca" that SPIRE can use.
            # Set issuerName to "spire-upstream-ca" and issuerKind to ClusterIssuer when using this.
            createBootstrapCA: false
            bootstrapCA:
              namespace: cert-manager               # namespace where cert-manager is installed
              commonName: zerotrust-ca.internal     # commonName for the self-signed CA certificate
              secretName: spire-upstream-ca-secret  # Secret where the CA cert/key are stored
              # bootstrapIssuerName: the ClusterIssuer used to sign the bootstrap CA certificate.
              # If createSelfSignedIssuer is true the chart creates a SelfSigned ClusterIssuer with this name.
              # If createSelfSignedIssuer is false a ClusterIssuer with this name must already exist.
              bootstrapIssuerName: selfsigned
              bootstrapIssuerGroup: cert-manager.io
              # createSelfSignedIssuer: when true the chart also creates a SelfSigned ClusterIssuer
              # named by bootstrapIssuerName. Set to false if one already exists in the cluster.
              createSelfSignedIssuer: false
              privateKey:
                algorithm: ECDSA
                size: 256

          # awsPca: SPIRE submits a CSR to AWS Private Certificate Authority.
          # Requires IRSA role ARN in zerotrust.providers.spire.server.serviceAccount.annotations with
          # acm-pca:IssueCertificate, acm-pca:GetCertificate, acm-pca:DescribeCertificateAuthority.
          awsPca:
            region: ""                      # AWS region of the ACM PCA
            certificateAuthorityArn: ""     # ARN of the ACM PCA

        ################################################
        ##  SPIRE Registrar configuration (sidecar)  ##
        ################################################
        registrar:
          image:
            name: 1.18.1/spire-k8s-registrar
            buildTag: "1.0.12"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
              - ALL
          # watchNamespaces: optional comma-separated list of namespaces for the registrar to watch.
          # When empty (default), the registrar watches all non-system namespaces — the correct
          # mode for multi-dataplane clusters where the registrar is shared across installs.
          watchNamespaces: ""
          # informerSyncTimeoutSeconds: how long (in seconds) the registrar waits for the Kubernetes
          # namespace or pod informer to complete its initial LIST sync before falling back to a
          # direct API call (for namespace informer) or continuing with a WARN (for pod informer).
          # Must be > 0. Default 60s accommodates cold JVM startup (TLS handshake + classloading).
          informerSyncTimeoutSeconds: 60
          # reconcileIntervalSeconds: how often (in seconds) the registrar runs a full reconcile
          # pass to heal missed events or orphan entries. Set to 0 to disable periodic reconcile.
          # Disabling periodic reconciliation is NOT recommended.
          reconcileIntervalSeconds: 300
          # healthPort: the port on which the registrar exposes /live and /ready probes.
          # Must not conflict with spire-server ports (8080 healthz, 8081 gRPC).
          healthPort: 8090
          # @schema
          # type: string
          # pattern: "^([1-9][0-9]*(m|h))?$"
          # examples: [30m,12h]
          # description: Optional per-entry TTL override for workload SPIRE entries (valkey, orchestrator, pep-server, inbound-worker, sink-agent, envoy). Defaults to 8h — shorter than agentSvidTTL (12h) so workload cert rotation is tightened out of the box, without affecting spire-agent's own node SVID lifetime or platform resilience to a spire-server outage. Set to "" to fall back to agentSvidTTL entirely, or to any other Go-duration string (minutes/hours only, greater than zero) to override the default.
          # @schema
          workloadSvidTTL: "8h"
          livenessProbe:
            httpGet:
              path: /live
              port: reg-health
            # liveness initialDelaySeconds: startup grace period (seconds) before the registrar's
            # liveness probe begins evaluating. Accounts for cold JVM startup (TLS handshake +
            # classloading). Default 30 was validated during live deploy-verify (Amendment 5).
            initialDelaySeconds: 30
            # liveness periodSeconds / livenessFailureThreshold: liveness probe cadence and
            # restart-trigger threshold for the registrar container.
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /ready
              port: reg-health
            # readiness initialDelaySeconds / readinessPeriodSeconds / readinessFailureThreshold:
            # readiness probe timing for the registrar container.
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      ################################################
      ##  SPIRE Agent                              ##
      ################################################
      agent:
        enabled: true
        nameOverride: ""
        fullnameOverride: "spire-agent"
        image:
          name: 1.18.1/spire-agent
          buildTag: "1.15.3"
        serviceAccount:
          enabled: true
          preexisting: false
          annotations: {}
          name: "spire-agent"
          automountServiceAccountToken: false
        podSecurityContextEnabled: true
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          supplementalGroups: [1000]
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
            - ALL
        podAnnotations: {}
        healthPort: 8088
        calicoNetpol:
          # @schema
          # default: false
          # type: boolean
          # description: If true, deploy a Calico NetworkPolicy for spire-agent. Requires the Calico CNI to be installed.
          # @schema
          enabled: false
          # outboundRule: destination rule for traffic to spire-server (ports 8081 gRPC and 8080 health).
          # DNS (port 53) and the Kubernetes API are always allowed and do not need to be included here.
          # Example for a ClusterIP service (CIDR covering the cluster service range):
          #   outboundRule:
          #     nets:
          #       - 10.96.0.0/12   # cluster service CIDR containing the spire-server ClusterIP
          outboundRule: {}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /live
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /ready
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
          successThreshold: 1
        nodeSelector: {}
        tolerations: []
        affinity: {}
        priorityClassName: ""
        workloadAttestors:
          k8s:
            verification:
              # Controls how the SPIRE agent verifies the kubelet TLS certificate.
              # apiServerCA: use the cluster CA (kube-root-ca.crt) — works for EKS and most managed k8s
              #              distributions where kubelet certs are signed by the cluster CA.
              # hostCert:    mount a CA cert from the host node filesystem (required for distributions
              #              that use a separate kubelet CA, e.g. RKE2). Set hostPath accordingly.
              # skip:        disable verification entirely — not recommended for production.
              # @schema
              # enum: [apiServerCA, hostCert, skip]
              # description: How spire-agent verifies the kubelet TLS certificate. apiServerCA for EKS/GKE/AKS, hostCert for RKE2/k3s, skip not recommended.
              # @schema
              type: apiServerCA
              # hostPath on the node to the CA cert that signed the kubelet serving certificate.
              # Only used when type is "hostCert".
              hostPath: ""

# clusterRefId is derived from clusterKey - do not set manually
clusterRefId: '{{ (eq .Values.clusterKey "") | ternary "" (printf "%s" (.Values.clusterKey | b64dec | fromJson).clusterRefId) }}'

