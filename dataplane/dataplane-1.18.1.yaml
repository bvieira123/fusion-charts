    initialDelaySeconds: 0
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
    successThreshold: 1

  # sinkAgent: readinessProbe
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # sinkAgent: livenessProbe
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: management
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # The sink-agent is a consumer (no inbound HTTP traffic via Service/Ingress); quarkus.shutdown.delay
  # is hardcoded to 0 in application.properties so the ShutdownEvent fires immediately on SIGTERM.
  # The drain budget for in-flight jobs at shutdown is:
  #   drainBudget = terminationGracePeriodSeconds - 10s (Quarkus internal reserve)
  # This budget covers the parallel job drain (audit + purge schedulers). It is set high (1h) as a
  # ceiling so a large backlog of in-flight audit/purge work can drain fully before the pod is killed.
  # The budget is an upper bound, not a fixed wait: the graceful-shutdown scheduler returns as soon as
  # the in-flight jobs actually finish, so a normal shutdown (jobs idle or quick) terminates promptly
  # and does not consume the full 1h.
  # Hard floor: must be > 10s — at <= 10s the drain is bypassed entirely (executorService.shutdownNow()).
  terminationGracePeriodSeconds: 3600

  ######################################
  ##      Security                    ##
  ######################################

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  #serviceaccount for sink-agent
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "sink-agent"
    automountServiceAccountToken: true

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################

  # Use the following block if you have Calico and want to use its network policies
  # You will need the Calico API server to be installed as well
  calicoNetpol:
    enabled: false
    # reference the targets the sink-agent is allowed to reach
    outboundRule: {}
      # use this to reference a (preexisting) networkset
      #selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidr here
    # managementRule: source allowed to reach the management port (8181) for kubelet probes.
    # Use a net (CIDR) covering the cluster node IP range, or a Calico selector.
    # NOTE: leaving empty ({}) renders `source: {}` → port 8181 OPEN to all cluster traffic.
    # Example:
    #   managementRule:
    #     nets:
    #       - 10.0.0.0/16    # VPC CIDR containing all cluster nodes
    managementRule: {}
    # prometheusRule: Calico EntityRule selecting the Prometheus instance(s) allowed to scrape
    # /q/metrics on port 8181. Empty ({}) = Prometheus blocked.
    # Examples:
    #   In-cluster Prometheus:
    #     prometheusRule:
    #       namespaceSelector: projectcalico.org/name == 'monitoring'
    #   External Prometheus (VM, other cluster, SaaS):
    #     prometheusRule:
    #       nets:
    #         - 192.168.10.42/32
    #   Label-based:
    #     prometheusRule:
    #       selector: role == 'prometheus'
    prometheusRule: {}

  ######################################
  ##      Capacity/Affinity           ##
  ######################################
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxSurge: 100%
      maxUnavailable: 0

  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 256Mi


  podDisruptionBudget:
    enabled: false
    minPods: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  ######################################
  ##      Environment                 ##
  ######################################
  nameOverride: ""
  fullnameOverride: ""

  #Java_Opts
  javaOpts: "-XX:+UseG1GC -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCInterval=300000 -XX:MaxRAMPercentage=90"

  ######################################
  ## Retention Policy Configuration   ##
  ######################################
  # Default set to false
  retention_job_purge_enabled: "true"
  # Default set to 00:00 AM, and It is applicable only for MANAGED_SHARED Fusion
  retention_job_purge_cron: "0 0 0 ? * * *"
  # Mail trigger interval in seconds for sink agent web socket connection failure
  mailTriggerInterval: 300

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: []
######################################
