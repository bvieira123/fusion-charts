{{- $existingTruststoreSecret := lookup "v1" "Secret" .Release.Namespace "truststore-password" -}}
{{- $isHelmOwned := false -}}
{{- if $existingTruststoreSecret -}}
  {{- $existingAnnotations := dig "metadata" "annotations" (dict) $existingTruststoreSecret -}}
  {{- if eq (index $existingAnnotations "meta.helm.sh/release-name") .Release.Name -}}
    {{- $isHelmOwned = true -}}
  {{- end -}}
{{- end -}}
{{- if $isHelmOwned -}}
{{- /* Created by an earlier revision of this same release — Helm already owns this object (it
       carries Helm's own release-tracking annotations from that Create), so re-rendering it here
       with its current, unchanged data is a safe no-op 3-way-merge. This keeps the resource
       present in every revision's rendered manifest so Helm's prune step never treats it as
       "removed" and deletes it (the bug this fixes: pruned on the 2nd release, then any pod
       recreation after that hits "secret not found"). Copying the looked-up data back verbatim
       means a genuine rotation of the live secret is still never overwritten. */ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: truststore-password
type: "Opaque"
data:
  password: {{ $existingTruststoreSecret.data.password }}
{{- else if $existingTruststoreSecret -}}
{{- /* Exists, but not owned by this release (created/managed externally, or by a differently-
       named release) — leave it alone exactly as before. Re-rendering it would make Helm try to
       adopt an object with no ownership metadata for this release, which fails the *entire*
       upgrade ("exists and cannot be imported into the current release") rather than just this
       one secret — so this case must stay a no-render, unlike the Helm-owned case above. */ -}}
{{- else if ne .Values.tls.truststorePassword "" -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: truststore-password
type: "Opaque"
stringData:
  password: {{ .Values.tls.truststorePassword }}
{{- else -}}
{{- $existingCertSecret := lookup "v1" "Secret" .Release.Namespace "certificate-password" -}}
{{- if $existingCertSecret -}}
{{- /* One-time upgrade migration: this secret is new as of this chart version, and every
       existing environment currently keys the mTLS truststore off certificate-password's
       value. Seed from its current value so upgrading requires no manual action. From this
       point on truststore-password is its own Secret object — future rotations of either
       secret do not affect the other. */ -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: truststore-password
type: "Opaque"
data:
  password: {{ $existingCertSecret.data.password }}
{{- else -}}
{{ fail "Secret 'truststore-password' is required. Create it external to helm chart, set tls.truststorePassword, or ensure 'certificate-password' exists so it can be seeded automatically." }}
{{- end -}}
{{- end -}}
