{{- if .Values.storage.azfiles.enabled -}}
{{- if .Values.storage.azfiles.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.storage.azfiles.secretName ).metadata | required "Secret .Values.storage.azfiles.secretName is required when azfiles enabled. Create it external to helm chart or set existingSecret to false" }}
{{- else }}

{{ $storageAccName := .Values.storage.azfiles.storageAccountName | trim | required "Value storageAccountName is required for the secret azurefs-secret" -}}
{{ $storageAccKey := .Values.storage.azfiles.azureStorageAccountKey | required "Value azureStorageAccountKey is required for the secret azurefs-secret" -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.storage.azfiles.secretName }}
type: "Opaque"
stringData:
  azurestorageaccountname: {{ $storageAccName | quote }}
  azurestorageaccountkey:  {{ $storageAccKey | quote }}

{{- end -}}
{{- end -}}
