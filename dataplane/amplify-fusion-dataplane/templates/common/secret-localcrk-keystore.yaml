{{/*
Guard, not a resource: this template renders nothing.

The 'localcrk' keystore file and its password are key material, so the chart never accepts them
as helm values and never creates the secret holding them — that keeps them out of values files,
version control and the helm release history. The secret must be created external to the helm
deployment, and this asserts it is there before the components are told to mount it.

Note that 'lookup' returns nothing during 'helm template' and 'helm install --dry-run', so those
cannot render a localcrk configuration even when the secret does exist in the cluster. That is
the same trade-off already made by certificate.yaml and secret-truststore-password.yaml.
*/}}
{{- $localForInbound := include "encryptAtRest.localEnabled" (dict "cfg" .Values.inboundWorker.encryptAtRest "encryption" .Values.encryption) -}}
{{- $localForOrchestrator := include "encryptAtRest.localEnabled" (dict "cfg" .Values.orchestrator.encryptAtRest "encryption" .Values.encryption) -}}
{{- if or (eq $localForInbound "true") (eq $localForOrchestrator "true") -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace "localcrk-keystore") -}}
{{/* A missing secret comes back as an empty map rather than nil, so test a field of it — the
     same idiom certificate.yaml and secret-truststore-password.yaml use. */}}
{{- $_ := $secret.metadata | required "Secret 'localcrk-keystore' is required when encryption.encryptAtRest.provider is 'localcrk'. Create it external to the helm chart, before installing: kubectl create secret generic localcrk-keystore -n <namespace> --from-file=keystore.p12=./localcrk.p12 --from-literal=password='<keystore password>'" -}}
{{- $data := $secret.data | default dict -}}
{{- if not (hasKey $data "keystore.p12") -}}
{{- fail "Secret 'localcrk-keystore' is missing the 'keystore.p12' entry, which holds the keystore file. Recreate it with --from-file=keystore.p12=./localcrk.p12" -}}
{{- end -}}
{{- if not (hasKey $data "password") -}}
{{- fail "Secret 'localcrk-keystore' is missing the 'password' entry, which holds the keystore password. Recreate it with --from-literal=password='<keystore password>'" -}}
{{- end -}}
{{- end -}}
