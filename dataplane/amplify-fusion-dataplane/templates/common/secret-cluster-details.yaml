{{- if .Values.secrets.clusterDetails.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.clusterDetails.name ).metadata | required "Secret .Values.secrets.clusterDetails.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.clusterDetails.name }}
type: "Opaque"
stringData:
  dxchange_jwt_secret: {{ ((eq .Values.clusterKey "") | ternary .Values.secrets.clusterDetails.jwtSecret (printf "%s" (.Values.clusterKey | b64dec | fromJson).secretKey)) | required "set required secrets.clusterDetails values if using shared dataplane. Otherwise set clusterKey" }}
  cluster_id: {{ ((eq .Values.clusterKey "") | ternary .Values.secrets.clusterDetails.clusterId (printf "%s" (.Values.clusterKey | b64dec | fromJson).id)) | required "set required secrets.clusterDetails values if using shared dataplane. Otherwise set clusterKey" }}
{{- end }}