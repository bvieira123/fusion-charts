{{- if .Values.email.authentication -}}
{{- if .Values.email.credentials.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.email.credentials.name ).metadata | required "Secret .Values.email.credentials.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}

{{ $emailUser := .Values.email.credentials.username | required "Value email.credentials.username is required for the email credentials secret" -}}
{{ $emailPass := .Values.email.credentials.password | required "Value email.credentials.password is required for the email credentials secret" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.email.credentials.name }}
type: "Opaque"
stringData:
  dxchange_email_username: {{ $emailUser | quote }}
  dxchange_email_frompassword: {{ $emailPass | quote }}
{{- end -}}
{{- end -}}
