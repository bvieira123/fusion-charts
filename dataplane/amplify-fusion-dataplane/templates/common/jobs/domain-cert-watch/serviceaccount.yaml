{{- if ( and .Values.tls.domainCertWatch.serviceAccount.enabled ( not .Values.tls.domainCertWatch.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "domainCertWatch.serviceAccountName" . }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
  {{- with .Values.tls.domainCertWatch.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}