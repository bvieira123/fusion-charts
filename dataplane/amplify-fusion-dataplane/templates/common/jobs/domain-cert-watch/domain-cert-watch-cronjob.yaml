{{- if .Values.tls.domainCertWatch.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ template "domainCertWatch.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    dplane: "domain-cert-watch-job"
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.tls.domainCertWatch.job_ttl }}
      template:
        metadata:
          labels:
            dplane: "domain-cert-watch-job"
        spec:
          serviceAccountName: {{ include "domainCertWatch.serviceAccountName" . }}
          containers:
            - image: "{{ default .Values.image.repository .Values.image.alpinetools.image.repository }}/{{ .Values.image.alpinetools.image.name }}:{{ .Values.image.alpinetools.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: [ "/bin/sh", "-c" ]
              args:
                - |
                  cm_name={{ template "domainCertWatch.appName" . }}
                  # Watches BOTH the TLS (domain-certificate) and SSH (ssh-domain-certificate) domain certs.
                  # $1=secret name  $2=configmap field  $3..=dplane labels to rollout-restart when the secret changes
                  roll_if_changed() {
                    secret="$1"; field="$2"; shift 2
                    if ! cert=$(kubectl get secrets "$secret" -o jsonpath='{.data}'); then
                      echo "Could not get the secret $secret"; return 1
                    fi
                    sha=$(echo -n "$cert" | sha1sum | awk '{print $1}')
                    echo "Generated $secret secret sha - $sha"
                    if ! cm=$(kubectl get configmap "$cm_name" -o json); then
                      echo "Failed to retrieve stored sha for field $field"; return 1
                    fi
                    stored=$(echo -n "$cm" | jq -r ".data.$field // \"UNINITIALIZED\"")
                    echo "Retrieved $secret stored sha - $stored"
                    if [ "$stored" = "UNINITIALIZED" ] || [ "$stored" != "$sha" ]; then
                      echo "Stored $field in configmap $cm_name does not match, updating entry"
                      if kubectl patch configmap "$cm_name" --type merge -p "{\"data\":{\"$field\":\"$sha\"}}"; then
                        echo "Updated configmap $cm_name with new $field - $sha"
                        if [ "$stored" != "UNINITIALIZED" ]; then
                          echo "The secret $secret has changed, rolling deployments: $*"
                          for sel in "$@"; do kubectl rollout restart deployment -l dplane="$sel"; done
                        fi
                      else
                        echo "Failed to update configmap $cm_name with $field"; return 1
                      fi
                    else
                      echo "The secret $secret has not changed, no action needed"
                    fi
                  }

                  rc=0
                  roll_if_changed domain-certificate sha envoy inbound-worker || rc=1
                  {{- if .Values.tls.sshCertificate.enabled }}
                  roll_if_changed ssh-domain-certificate ssh_sha inbound-worker || rc=1
                  {{- end }}
                  exit $rc
              name: domain-cert-watch
              {{- with .Values.tls.domainCertWatch.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          restartPolicy: Never
          {{- with .Values.image.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.tls.domainCertWatch.podSecurityContextEnabled -}}
          {{- with .Values.tls.domainCertWatch.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
  schedule: {{ .Values.tls.domainCertWatch.schedule | squote }}
  successfulJobsHistoryLimit: 1
  suspend: false
{{- end }}
