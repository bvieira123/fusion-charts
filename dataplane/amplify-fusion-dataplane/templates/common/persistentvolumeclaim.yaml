{{- if .Values.storage.pvc.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Namespace }}-{{ .Values.storage.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - {{ .Values.storage.pvc.claimAccessMode }}
  storageClassName: {{ .Values.storage.pvc.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.pvc.claimRequestCapacity }}
{{- end -}}