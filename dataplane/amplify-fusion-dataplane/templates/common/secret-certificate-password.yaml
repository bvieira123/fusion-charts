{{- if eq  .Values.tls.domainCertificate.password "" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "certificate-password" ).metadata | required "Secret 'certificate-password' is required. Create it external to helm chart or set tls.domainCertificate.password" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: certificate-password
type: "Opaque"
stringData:
  password: {{ required "tls.domainCertificate.password is required for the secret certificate-password" .Values.tls.domainCertificate.password }}
{{- end }}