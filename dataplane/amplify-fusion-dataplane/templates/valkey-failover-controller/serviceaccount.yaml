{{- if and (eq (include "valkey.internal.subQuorumFailoverRequired" .) "true") (not .Values.valkey.internal.failoverController.serviceAccount.preexisting) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valkeyFailoverController.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml .Values.valkey.internal.failoverController.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: {{ .Values.valkey.internal.failoverController.serviceAccount.automountServiceAccountToken }}
{{- end }}
