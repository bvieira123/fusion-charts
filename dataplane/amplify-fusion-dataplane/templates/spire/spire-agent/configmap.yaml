{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spire-agent.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-agent.labels" . | nindent 4 }}
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/agent"
      log_level = "INFO"
      server_address = "{{ include "spire-server.fullname" . }}"
      server_port = "8081"
      socket_path = "{{ .Values.zerotrust.providers.spire.workload.socketPath }}"
      trust_domain = "{{ .Values.zerotrust.providers.spire.trustDomain }}"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      # Treat the cached bundle as disposable. KeyManager is "memory", so the agent
      # re-attests on every restart; if its stored bundle can no longer validate the
      # server (e.g. the spire-server root CA rolled while the agent was down), it
      # discards the stale bundle and re-bootstraps from trust_bundle_path (the
      # spire-bundle ConfigMap, kept current by the k8sbundle notifier) instead of
      # crash-looping with "x509: certificate signed by unknown authority".
      rebootstrap_mode = "auto"
      rebootstrap_delay = "1m"
    }
    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "{{ .Values.zerotrust.providers.spire.clusterName }}"
          token_path = "/var/run/secrets/tokens/spire-agent"
        }
      }
      KeyManager "memory" {
        plugin_data {}
      }
      WorkloadAttestor "k8s" {
        plugin_data {
          {{- if eq .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.type "hostCert" }}
          kubelet_ca_path = "/run/spire/agent/kubelet-ca.crt"
          {{- else if eq .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.type "apiServerCA" }}
          kubelet_ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          {{- end }}
          skip_kubelet_verification = {{ eq .Values.zerotrust.providers.spire.agent.workloadAttestors.k8s.verification.type "skip" }}
          node_name_env = "NODE_NAME"
        }
      }
    }
    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "{{ .Values.zerotrust.providers.spire.agent.healthPort }}"
      live_path = "/live"
      ready_path = "/ready"
    }
{{- end }}
