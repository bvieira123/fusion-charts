{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{- include "spire-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
    - name: healthz
      port: 8080
      targetPort: healthz
      protocol: TCP
  selector:
    {{- include "spire-server.selectorLabels" . | nindent 4 }}
{{- end }}
