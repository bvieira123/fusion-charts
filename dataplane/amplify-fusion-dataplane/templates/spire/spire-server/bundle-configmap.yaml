{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
# Pre-create the bundle ConfigMap so the agent DaemonSet can be scheduled immediately
# on fresh deployments. The k8sbundle notifier will populate bundle.crt after the
# SPIRE server starts. Without this, the agent pod is stuck in ContainerCreating until
# the server has already written the ConfigMap, blocking PEP/orchestrator init containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.zerotrust.providers.spire.server.bundleConfigMapName }}
  namespace: {{ include "spire.namespace" . }}
  labels:
    {{ include "spire-server.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data: {}
{{- end }}
