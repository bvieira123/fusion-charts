{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-server.labels" . | nindent 4 }}
rules:
  # k8sbundle notifier: writes the SPIRE CA bundle to a ConfigMap in this namespace only
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  {{- if eq .Values.zerotrust.providers.spire.server.upstreamAuthority.type "certManager" }}
  # cert-manager UpstreamAuthority: spire-server submits CertificateRequests to cert-manager
  # to get its intermediate CA signed. Only needed when upstreamAuthority.type=certManager.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests"]
    verbs: ["create", "delete", "get", "list", "watch"]
  {{- end }}
{{- end }}
