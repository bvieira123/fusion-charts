{{- if .Values.pepServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "pep-server.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pep-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.pepServer.autoscaling.enabled }}
  replicas: {{ .Values.pepServer.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.pepServer.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.pepServer.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.pepServer.strategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "pep-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.pepServer.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pep-server.selectorLabels" . | nindent 8 }}
        {{- if .Values.zerotrust.enabled }}
        {{ .Values.zerotrust.managedLabel }}: "true"
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.pepServer.terminationGracePeriodSeconds }}
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.pepServer.serviceAccount.enabled }}
      serviceAccountName: {{ include "pep-server.serviceAccountName" . }}
      {{- end }}
      {{- if .Values.pepServer.podSecurityContextEnabled }}
      securityContext: {{- toYaml .Values.pepServer.podSecurityContext | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - name: use-vc
      initContainers:
        - name: {{ .Chart.Name }}-init
          securityContext:
            {{- toYaml .Values.pepServer.securityContext | nindent 12 }}
          image: "{{ default .Values.image.repository .Values.image.alpinetools.image.repository }}/{{ .Values.image.alpinetools.image.name }}:{{ .Values.image.alpinetools.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: configmap-common
          volumeMounts:
            - name: {{ .Values.storage.volumeStorageName }}
              mountPath: /efs
          command:
            - "/bin/sh"
            - "-c"
            - |
              {{- if .Values.valkey.internal.enabled }}
              {{ include "dataplane.commonInit" (dict "context" . "buildTag" .Values.pepServer.image.buildTag "internal" true "replicas" .Values.valkey.internal.clusterSize) | nindent 14 }}
              {{- else if .Values.valkey.external.enabled }}
              {{ include "dataplane.commonInit" (dict "context" . "buildTag" .Values.pepServer.image.buildTag) | nindent 14 }}
              {{- end }}

              {{- if .Values.fluentBit.enabled }}
              {{ include "dataplane.createLogDirectory" (dict "serviceName" "pep-server" "efsRoot" "${efs_root}" "podName" "${POD_NAME}" "additionalPathParam" "") | nindent 14 }}
              {{- end }}
          {{- with .Values.image.initContainers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- include "amplify-fusion.zerotrust.initContainers" . | nindent 8 }}
      containers:
        - name: {{ template "pep-server.appName" . }}
          securityContext:
            {{- toYaml .Values.pepServer.securityContext | nindent 12 }}
          image: "{{ default .Values.image.repository .Values.pepServer.image.repository }}/{{ .Values.pepServer.image.name }}:{{ .Values.pepServer.image.buildTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: configmap-common
            - secretRef:
                name: {{ .Values.secrets.clusterDetails.name }}
            - configMapRef:
                name: {{ template "pep-server.appName" . }}
            {{- if .Values.valkey.enabled }}
            - secretRef:
                name: {{ .Values.secrets.datagrid.name }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: local_ip
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- with .Values.pepServer.env }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 9090
              name: xds
            - containerPort: 8181
              name: management
          volumeMounts:
            - name: {{ .Values.storage.volumeStorageName }}
              mountPath: /efs
            - name: tmpdir
              mountPath: /tmp
            {{- include "amplify-fusion.zerotrust.workloadVolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.pepServer.resources | nindent 12 }}
          livenessProbe: {{- toYaml .Values.pepServer.livenessProbe | nindent 12 }}
          startupProbe: {{- toYaml .Values.pepServer.startupProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.pepServer.readinessProbe | nindent 12 }}
      volumes:
      {{- include "amplify-fusion.zerotrust.workloadVolumes" . | nindent 6 }}
      - name: tmpdir
        emptyDir: {}
      - name: {{ .Values.storage.volumeStorageName }}
        persistentVolumeClaim:
          claimName: {{ .Release.Namespace }}-{{ .Values.storage.claimName }}
      {{- with .Values.pepServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pepServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pepServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
