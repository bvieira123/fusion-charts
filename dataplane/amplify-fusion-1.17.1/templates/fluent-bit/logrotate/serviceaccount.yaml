{{- if .Values.fluentBit.logrotate.serviceAccount.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logrotate.serviceAccountName" . }}
  labels:
    {{- include "dataplane.labels" . | nindent 4 }}
  {{- with .Values.fluentBit.logrotate.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}