{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) (eq .Values.zerotrust.providers.spire.server.upstreamAuthority.type "certManager") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spire-server.fullname" . }}-certmanager-approver
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-server.labels" . | nindent 4 }}
rules:
  # cert-manager UpstreamAuthority: spire-server must approve its own CertificateRequests.
  # certificaterequests/approval and signers are cluster-scoped resources.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificaterequests/approval"]
    verbs: ["update"]
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
    resourceNames:
      - "clusterissuers.cert-manager.io/*"
      - "issuers.cert-manager.io/*"
{{- end }}
