{{- if and .Values.zerotrust.enabled (not .Values.zerotrust.providers.spire.preexisting) }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "spire-server.fullname" . }}
  namespace: {{ include "spire.namespace" . }}
  annotations:
    {{ include "spire.keepAnnotation" . | nindent 4 }}
  labels:
    {{ include "spire-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "spire-server.fullname" . }}
  selector:
    matchLabels:
      {{ include "spire-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{ include "spire-server.selectorLabels" . | nindent 8 }}
      {{- with .Values.zerotrust.providers.spire.server.podAnnotations }}
      annotations:
        {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.image.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "spire-server.serviceAccountName" . }}
      {{- if .Values.zerotrust.providers.spire.server.podSecurityContextEnabled }}
      securityContext:
        {{ toYaml .Values.zerotrust.providers.spire.server.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: spire-server
          image: "{{ default .Values.global.image.repository .Values.zerotrust.providers.spire.server.image.repository }}/{{ .Values.zerotrust.providers.spire.server.image.name }}:{{ .Values.zerotrust.providers.spire.server.image.buildTag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - -config
            - /run/spire/config/server.conf
          ports:
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: healthz
              containerPort: 8080
              protocol: TCP
          livenessProbe: {{- toYaml .Values.zerotrust.providers.spire.server.livenessProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.zerotrust.providers.spire.server.readinessProbe | nindent 12 }}
          {{- if .Values.zerotrust.providers.spire.server.securityContext }}
          securityContext:
            {{ toYaml .Values.zerotrust.providers.spire.server.securityContext | nindent 12 }}
          {{- end }}
          resources:
            {{ toYaml .Values.zerotrust.providers.spire.server.resources | nindent 12 }}
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- if eq .Values.zerotrust.providers.spire.server.upstreamAuthority.type "disk" }}
            - name: upstream-ca
              mountPath: /run/spire/upstream-ca
              readOnly: true
            {{- end }}

        - name: spire-registrar
          image: "{{ default .Values.global.image.repository .Values.zerotrust.providers.spire.server.registrar.image.repository }}/{{ .Values.zerotrust.providers.spire.server.registrar.image.name }}:{{ .Values.zerotrust.providers.spire.server.registrar.image.buildTag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: reg-health
              containerPort: {{ .Values.zerotrust.providers.spire.server.registrar.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /live
              port: reg-health
            initialDelaySeconds: {{ .Values.zerotrust.providers.spire.server.registrar.livenessInitialDelaySeconds }}
            periodSeconds: {{ .Values.zerotrust.providers.spire.server.registrar.livenessPeriodSeconds }}
            failureThreshold: {{ .Values.zerotrust.providers.spire.server.registrar.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /ready
              port: reg-health
            initialDelaySeconds: {{ .Values.zerotrust.providers.spire.server.registrar.readinessInitialDelaySeconds }}
            periodSeconds: {{ .Values.zerotrust.providers.spire.server.registrar.readinessPeriodSeconds }}
            failureThreshold: {{ .Values.zerotrust.providers.spire.server.registrar.readinessFailureThreshold }}
          env:
            - name: TRUST_DOMAIN
              value: {{ .Values.zerotrust.providers.spire.trustDomain | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.zerotrust.providers.spire.clusterName | quote }}
            {{- if .Values.zerotrust.providers.spire.server.registrar.watchNamespaces }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.zerotrust.providers.spire.server.registrar.watchNamespaces | quote }}
            {{- end }}
            - name: DATAPLANE_NAMESPACE_LABEL
              value: {{ .Values.zerotrust.providers.spire.dataplaneLabel | quote }}
            - name: SPIRE_SERVER_SOCKET
              value: "/tmp/spire-server/private/api.sock"
            - name: INFORMER_SYNC_TIMEOUT_SECONDS
              value: {{ .Values.zerotrust.providers.spire.server.registrar.informerSyncTimeoutSeconds | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.zerotrust.providers.spire.server.registrar.reconcileIntervalSeconds | quote }}
            - name: HEALTH_PORT
              value: {{ .Values.zerotrust.providers.spire.server.registrar.healthPort | quote }}
            {{- if .Values.zerotrust.providers.spire.server.registrar.workloadSvidTTL }}
            - name: WORKLOAD_SVID_TTL
              value: {{ .Values.zerotrust.providers.spire.server.registrar.workloadSvidTTL | quote }}
            {{- end }}
          {{- if .Values.zerotrust.providers.spire.server.registrar.securityContext }}
          securityContext:
            {{ toYaml .Values.zerotrust.providers.spire.server.registrar.securityContext | nindent 12 }}
          {{- end }}
          resources:
            {{ toYaml .Values.zerotrust.providers.spire.server.registrar.resources | nindent 12 }}
          volumeMounts:
            - name: spire-server-socket
              mountPath: /tmp/spire-server/private
            - name: registrar-tmp
              mountPath: /tmp
            - name: kube-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: spire-config
          configMap:
            name: {{ include "spire-server.fullname" . }}
        - name: spire-server-socket
          emptyDir: {}
        - name: registrar-tmp
          emptyDir: {}
        - name: kube-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  optional: true
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        {{- if eq .Values.zerotrust.providers.spire.server.upstreamAuthority.type "disk" }}
        - name: upstream-ca
          secret:
            secretName: {{ .Values.zerotrust.providers.spire.server.upstreamAuthority.disk.secretName }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.zerotrust.providers.spire.server.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zerotrust.providers.spire.server.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.zerotrust.providers.spire.server.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
      {{- end }}

  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.zerotrust.providers.spire.server.persistence.storageClass }}
        storageClassName: {{ .Values.zerotrust.providers.spire.server.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.zerotrust.providers.spire.server.persistence.size }}
{{- end }}
