{{- if and .Values.common.ssh_certificate.enabled (not .Values.common.ssh_certificate.manually_created) -}}
{{- if .Values.common.ssh_certificate.rotationPeriod -}}
{{- if gt (atoi (trimSuffix "h" .Values.common.ssh_certificate.rotationPeriod)) 8760 -}}
{{- fail "common.ssh_certificate.rotationPeriod exceeds the maximum allowed value of 8760h (1 year)" -}}
{{- end -}}
{{- end -}}
{{- if eq .Values.common.ssh_certificate.algorithm "RSA" -}}
{{- if lt (int .Values.common.ssh_certificate.keySize) 2048 -}}
{{- fail "common.ssh_certificate.keySize must be at least 2048 for RSA" -}}
{{- end -}}
{{- else if eq .Values.common.ssh_certificate.algorithm "ECDSA" -}}
{{- $ks := int .Values.common.ssh_certificate.keySize -}}
{{- if not (or (eq $ks 256) (eq $ks 384) (eq $ks 521)) -}}
{{- fail "common.ssh_certificate.keySize must be one of 256, 384, 521 for ECDSA" -}}
{{- end -}}
{{- end -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ssh-domain-certificate
  namespace: {{ .Release.Namespace }}
spec:
  secretName: ssh-domain-certificate
  {{- if .Values.common.ssh_certificate.rotationPeriod }}
  duration: {{ .Values.common.ssh_certificate.rotationPeriod }}
  {{- end }}
  {{- if .Values.common.ssh_certificate.renewBefore }}
  renewBefore: {{ .Values.common.ssh_certificate.renewBefore }}
  {{- end }}
  subject:
    organizations:
      - fusion
  {{- if eq (include "parent.dataplaneMode" . ) "shared" }}
  commonName: "*.{{ .Values.global.external_domain }}"
  {{- else if .Values.global.multihost.enabled }}
  commonName: "*.{{ .Values.global.external_domain }}"
  {{- else }}
  commonName: "{{ .Values.global.external_domain }}"
  {{- end }}
  isCA: false
  dnsNames:
    {{- if eq (include "parent.dataplaneMode" . ) "shared" }}
    - "*.{{ .Values.global.external_domain }}"
    {{- else if .Values.global.multihost.enabled }}
    - "*.{{ .Values.global.external_domain }}"
    {{- end }}
    - {{ .Values.global.external_domain }}
  privateKey:
    algorithm: {{ .Values.common.ssh_certificate.algorithm }}
    encoding: PKCS8
    {{- if ne .Values.common.ssh_certificate.algorithm "Ed25519" }}
    size: {{ .Values.common.ssh_certificate.keySize }}
    {{- end }}
    rotationPolicy: {{ .Values.common.ssh_certificate.rotationPolicy }}
  issuerRef:
    name: {{ .Values.common.ssh_certificate.issuerRef.name }}
    kind: {{ .Values.common.ssh_certificate.issuerRef.kind }}
  keystores:
    pkcs12:
      create: true
      profile: LegacyDES
      passwordSecretRef:
        name: ssh-certificate-password
        key: password
{{- end -}}
