{{- if .Values.common.ssh_certificate.enabled -}}
{{- if eq .Values.common.ssh_certificate.password "" -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace "ssh-certificate-password").metadata | required "Secret 'ssh-certificate-password' is required. Create it external to helm chart or set common.ssh_certificate.password" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ssh-certificate-password
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  password: {{ required "common.ssh_certificate.password is required for secret ssh-certificate-password" .Values.common.ssh_certificate.password | b64enc }}
{{- end }}
{{- end -}}
