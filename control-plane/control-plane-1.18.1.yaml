######################################
##      Configuration               ##
######################################

# In order to install the control plane, you need to set acceptGeneralConditions to "yes":
# You hereby accept that the Axway Products and/or Services shall be governed exclusively by the Axway General Terms and Conditions
# located at https://www.axway.com/sites/default/files/Legal_documents/License_general_conditions/Axway_General_Conditions_version_april_2014_eng_(France).pdf
# unless an agreement has been signed with Axway in which case such agreement shall apply.
acceptGeneralConditions: "yes"

# Unique identifier for your environment
appEnv: studio

# Default currency ISO code for tenant
default_currency_code: "USD"

# Hostname for your control plane
external_domain: "fusion.gnosistech.com.br"

# Prefix for envoy load balancer domain: <shared_lb_prefix>.<external_domain>
shared_lb_prefix: "ha-lb"

# Set to true to manage ConfigMaps separately to the helm chart deployment
#### WARNING!! ####
# Values set in configMaps are critical to the functionality of the application
# Names and values must be consistent with what is expected
# If these are not managed correctly, the application may not work as intended
externalConfigMaps: false

# Single-tenant mode migrated from common.singleTenantMode
singleTenantMode: true
# Set to true when deploying a shared Fusion - enables cluster-details secret injection in api, im, and auditservice
clusterSecretKey: false

######################################
##      Image                       ##
######################################

image:
  repository: docker.repository.axway.com/amplifyfusion-docker-prod
  # pullPolicy the image pull policy
  pullPolicy: IfNotPresent
  # imagePullSecrets - secret that stores credentials for access to a registry for docker images
  # This secret is the image pull secrets used by all the charts
  # Use your Axway credentials if pulling from the Axway repository
  # For a customer: create the secret:
  #      REGISTRY_USERNAME= # credentials from your service account
  #      REGISTRY_PASSWORD= # credentials from your service account
  #      REGISTRY_SERVER=docker.repository.axway.com
  #      kubectl create secret docker-registry ampint-docker-artifactory --docker-server="${REGISTRY_SERVER}" --docker-username="${REGISTRY_USERNAME}" --docker-password="${REGISTRY_PASSWORD}"
  imagePullSecrets:
  - name: axway-registry
  createPullSecret:
    dockerconfigjson: ''
  alpinetools:
    image:
      name: 1.18.1/alpine-tools
      buildTag: 1.6.2

  initContainers:
    # ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi
email:
  # Admin notification email - e.g. myadminemail@example.com
  adminAddress: "admin@gnosistech.com.br"
  # SMTP server hostname - e.g. smtp.office365.com
  host: "email-smtp.us-east-1.amazonaws.com"
  # SMTP port - e.g. 587
  port: "587"
  # Sender email address - e.g. myemail@example.com
  fromAddress: "admin@gnosistech.com.br"
  # Support email address displayed to users
  supportAddress: "admin@gnosistech.com.br"
  # Send admin email notifications on event status changes
  adminNotifyOnEvents: "true"
  # Notification recipient for subscription fulfilment events
  fulfillmentAddress: ""
  # Notification recipient for tenant approval events
  tenantApproverAddress: ""

  # If authentication.enabled is true, email.credentials must be set with valid username and password
  authentication:
    enabled: true

  # SMTP credentials secret
  credentials:
    name: "email-password"
    existingSecret: true
    username: "AKIAVJZ7PDGTGVL6L6WL" # AWS SES SMTP username
    password: "" # AWS SES SMTP password

######################################
##      Secrets                     ##
######################################
# This block generates secrets that will be used by the other Helm charts

secrets:
  # Postgres database credentials
  postgres:
    name: "ampint-spring-datasource"
    existingSecret: true
    username: ""
    password: ""

  # Cluster identity - JWT secret and cluster ID
  # jwtSecret and clusterId should be the same for both Studio and Fusion.
  # Use a password generator to create a 30-character alphanumeric string for the JWT token.
  # Use https://www.uuidgenerator.net/ to generate the clusterId.
  # Dxchange jwt-token is used for the websocket connection between CP and DP.
  clusterDetails:
    name: "cluster-details"
    # set to true if managing secrets external to helm deployment
    existingSecret: true
    jwtSecret: ""
    clusterId: "" # use UUID (https://www.uuidgenerator.net/)

  # MongoDB connection URI
  mongoDB:
    name: "ampint-mongodb-uri"
    # set to true if managing secrets external to helm deployment
    existingSecret: true
    uri: ""

######################################
##      Storage                     ##
######################################

storage:
  # volumeMount name - name to identify the mounted volume - internal kubernetes use only
  volumeMounts:
    name: efs-storage
  persistentVolumeClaim:
    claimName: azure-fileshare-pvc
  efsRoot: "/efs"

  ## Amazon EFS ##
  efs:
    capacity: 100Gi
    enabled: false
    id: fs-xxxxxx
    pv: efs-pv
    sc: efs-sc
  pvc:
    claimAccessMode: ReadWriteMany
    claimRequestCapacity: ''
    enabled: false
    storageClass: ''
database:
  # Relational database name - currently must be 'dxchange'
  name: "dxchange"
  # Relational database endpoint - e.g. postgresdb-postgresql.mynamespace.svc.cluster.local
  endpoint: "postgresdb-postgresql.amplify-studio.svc.cluster.local:5432"

######################################
##      Ports                       ##
######################################

ports:
  apiAuthPort: 8080
  auditSvcPort: 9080
  imMonitorPort: 9080

######################################
##      Logging                     ##
######################################

logging:
  # This setting controls whether log files are generated in the efsRoot filesystem.
  # If set to false, logs will only be written to the console (used in SaaS environments where
  # Fluent Bit captures logs directly from the node's container log stream as a DaemonSet).
  logFileEnabled: true

  # This setting controls the log output format.
  # If true, logs are written in JSON format.
  # If false, logs are written in plain text format.
  logJsonEnabled: true


######################################
##           Predeploy              ##
######################################
predeploy:
  enabled: true

  ######################################
  ##     Security                     ##
  ######################################

  #serviceaccount for predeploy
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "predeploy"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  ######################################
  ##           Resources              ##
  ######################################
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1500m
      memory: 1Gi

  ######################################
  ##     Migration jobs               ##
  ######################################
  masterschemamigration:
    enabled: true
    image:
      repository: ""
      name: 1.18.1/dxchange-schema-migration-job
      buildTag: 1.18.1
    # @schema
    # type: array
    # items:
    #   oneOf:
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         value:
    #           type: string
    #       required: [name, value]
    #       additionalProperties: false
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         valueFrom:
    #           type: object
    #       required: [name, valueFrom]
    #       additionalProperties: false
    # @schema
    env:
    - name: JAVA_OPTS
      value: "-XX:+UseG1GC -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCInterval=300000 -XX:MaxRAMPercentage=90"
  tenantmigration:
    enabled: true
    image:
      repository: ""
      name: 1.18.1/tenant-schema-migration-job
      buildTag: 1.18.1

  datamigration:
    enabled: true
    image:
      repository: ""
      name: 1.18.1/data-migration-job
      buildTag: 1.18.1

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    postgresoutboundRule: {}
      # use this to reference a networkset
      #selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

######################################
##           Frontend              ##
######################################
ui:
  enabled: true

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # ui: livenessProbe
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # ui: startupProbe
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 180
    successThreshold: 1

  # ui: readinessProbe
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 120
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.18.1/frontend
    buildTag: 1.18.1

  ######################################
  ##      Security                    ##
  ######################################

  # serviceaccount for ui
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "ui"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"

  ######################################
  ##      Resources and autoscaling   ##
  ######################################
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  ######################################
  ##      Service                    ##
  ######################################
  service:
    type: ClusterIP
    ports:
    - protocol: TCP
      port: 443
      targetPort: 8080

  ######################################
  ##      common properties           ##
  ######################################
  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0

  nameOverride: ""
  fullnameOverride: ""

  ######################################
  ##      Ingress and Affinity        ##
  ######################################
  # Ingress information
  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: "*.{{- .Values.external_domain -}},{{- .Values.external_domain -}}"
      ingress.kubernetes.io/ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
      nginx.org/hsts: "true"
      nginx.org/hsts-max-age: "11536000"
      nginx.org/hsts-include-subdomains: "true"
      nginx.org/hsts-preload: "true"
    hosts:
    - host: "*.{{- .Values.external_domain -}}"
      paths:
      - path: /
        serviceName: ui-{{- .Values.appEnv -}}
        servicePort: 443
      - path: /api/
        serviceName: api-{{- .Values.appEnv -}}
        servicePort: 8080
    - host: "{{- .Values.external_domain -}}"
      paths:
      - path: /
        serviceName: ui-{{- .Values.appEnv -}}
        servicePort: 443
    tls:
    - hosts:
      - "*.{{- .Values.external_domain -}}"
      secretName: ui-wildard-certificate
    - hosts:
      - "{{- .Values.external_domain -}}"
      secretName: ui-certificate

  affinity: {}

  nodeSelector: {}

  tolerations: []

######################################
##           Hazelcast              ##
######################################
hazelcast:
  enabled: true
  kind: StatefulSet
  # Minimum cluster members before the cluster is considered healthy
  min_member_count: 1

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.18.1/hazelcast-server
    # Overrides the image tag whose default is the chart appVersion.
    buildTag: 1.18.1

  #Environment Properties
  hazelcastYaml: hazelcast-yaml
  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 1
  # Only used when kind: Deployment (StatefulSet ignores these)
  maxSurge: 100%
  maxUnavailable: 0

  ######################################
  ##           Storage                 #
  ######################################

  ebs_root: "/mdisk"
  efs_load_store_queues: "false"
  efs_load_store_maps: "true"

  persistence:
    #claimTemplateRequestStorage storage request size for the claim template
    claimTemplateRequestStorage: 5Gi
    #claimTemplateStorageClass class that will dynamically create storage on desired cloud platform
    #For AWS set this value to gp3
    #For Azure set this value to managed-csi
    claimTemplateStorageClass: "longhorn-1r"
    #claimTemplateName name of the claim for hazelcast queue storage
    claimTemplateName: hazelcast-queue-storage
    #claimTemplateAccessModes access mode for claim template
    claimTemplateAccessModes: ReadWriteOnce

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  #TerminationGracePeriod
  terminationGracePeriodSeconds: "60"

  # hazelcast: livenessProbe
  livenessProbe:
    httpGet:
      path: /hazelcast/health
      port: 5701
    initialDelaySeconds: 30
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # hazelcast: startupProbe
  startupProbe:
    httpGet:
      path: /hazelcast/health/ready
      port: 5701
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1

  # hazelcast: readinessProbe
  readinessProbe:
    httpGet:
      path: /hazelcast/health/ready
      port: 5701
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for hazelcast
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "hazelcast"
    automountServiceAccountToken: true

  podAnnotations: {}

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  ######################################
  ##      Service                    ##
  ######################################

  service:
    type: ClusterIP
    ports:
    - name: http
      protocol: TCP
      port: 5701
      targetPort: 5701

  ######################################
  ##      Resources                   ##
  ######################################
  #JAVA_OPTS
  xms_xmx: "-Dhazelcast.config=/data/hazelcast/hazelcast.yaml -XX:+UseG1GC -Xms512m -Xmx1536m"
  agentOpts: "-javaagent:/app/lib/jmx_prometheus_javaagent-1.0.1.jar=8080:/app/jmx_exporter.yml"

  resources:
    limits:
      cpu: 1000m
      memory: 3Gi
    requests:
      cpu: 100m
      memory: 1Gi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  calicoNetpol:
    enabled: false

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: []

######################################
##              API                 ##
######################################
api:
  enabled: true

  ######################################
  ##             Ingress              ##
  ######################################
  #Ingress information
  ingress:
    enabled: false
    className: nginx
    #Ingress annotations
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: "services.{{- .Values.external_domain -}}"
      ingress.kubernetes.io/ssl-redirect: "true"
      nginx.org/client-body-buffer-size: "100m"
      nginx.org/client-max-body-size: "100m"
      nginx.org/proxy-connect-timeout: "300"
      nginx.org/proxy-read-timeout: "300"
      nginx.org/proxy-send-timeout: "300"
      nginx.org/hsts: "true"
      nginx.org/hsts-max-age: "21536000"
      nginx.org/hsts-include-subdomains: "true"
      nginx.org/hsts-preload: "true"
    hosts:
    - host: "services.{{- .Values.external_domain -}}"
      paths:
      - path: /api/
        serviceName: api-{{- .Values.appEnv -}}
        servicePort: 8080
      - path: /api/monitor/
        serviceName: im-{{- .Values.appEnv -}}
        servicePort: 9080
      - path: /monitor/ws
        serviceName: im-{{- .Values.appEnv -}}
        servicePort: 9080
      - path: /auditservice/
        serviceName: auditservice-{{- .Values.appEnv -}}
        servicePort: 9080                                          # don't change the port
    tls:
    - hosts:
      - "services.{{- .Values.external_domain -}}"
      secretName: services-certificate

  sftp_server_port: "9022"

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.18.1/api
    buildTag: 1.18.1

  aws:
    enabled: false
    publicZoneId: ""
    region: ""

  cloud_provider: "AWS"

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for api
  serviceAccount:
    # Specifies whether a service account should be associated
    name: "api"
    enabled: true
    # Use a preexisting service account instead of recreating one
    preexisting: false
    # Annotations to add to the service account (if creating one and not reusing an existing one)
    annotations: {}
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault


  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  service:
    type: ClusterIP
    ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: management
      protocol: TCP
      port: 8181
      targetPort: 8181

  xms_xmx: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=90 -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=$JBOSS_MODULES_SYSTEM_PKGS -Djava.awt.headless=true"
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 150m
      memory: 512Mi

  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0

  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # api: livenessProbe
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # api: startupProbe
  startupProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 300
    successThreshold: 1

  # api: readinessProbe
  readinessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 120
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  podAnnotations: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  nodeSelector: {}

  tolerations: []

  affinity: {}

  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"
    # reference the postgres target
    postgresoutboundRule: {}
      # use this to reference a networkset
      # selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      #   - 0.0.0.0/0 # put your subnet cidr here
    # reference the outbound target
    outboundRule:
      # use this to reference a networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

  #podDisruptionBudget:
  #  enabled: false
  #  minPods: 1

  #mamimum number of db connections allowed (to rds).
  database:
    maxPoolSize: "20" # default value

  #SSE Static rout name
  sse_cluster_name: inbound-worker-sse

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: LOG_LEVEL
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: []

######################################
##                IM                ##
######################################
im:
  enabled: true

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # im: livenessProbe
  livenessProbe:
    httpGet:
      path: /api/monitor/health
      port: 9080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # im: startupProbe
  startupProbe:
    httpGet:
      path: /openapi
      port: 8181
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 180
    successThreshold: 1

  # im: readinessProbe
  readinessProbe:
    httpGet:
      path: /api/monitor/health
      port: 9080
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.18.1/integration-manager
    buildTag: 1.18.1

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for im
  serviceAccount:
