######################################
##         FluentBit                ##
######################################
fluentBit:
  enabled: false

  # Default set to DaemonSet
  # Possible Values : DaemonSet / Deployment
  # Configure it as Deployment for environments where root permission is not allowed and Fluent-Bit is used only for offloading logs to other locations
  kind: DaemonSet

  image:
    name: 1.18.1/fluent-bit
    buildTag: 5.1.2-axway-1

  nameOverride: ""

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001


  calicoNetpol:
    enabled: false
    # reference the targets, fluentBit is allowed to reach
    outboundRule:
      # use this to reference a (preexisting) networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidr here

  # Configuration for custom service, inputs, filters, and outputs
  # Used by both DaemonSet and Deployment modes to extend FluentBit configuration
  config:
    service: ""
    inputs: ""
    filters: ""
    outputs: ""

  # Use existing ConfigMap for fluent-bit configuration instead of generated one
  existingConfigMap: ""

  # Environment variables
  env: []

  # Environment variables with template support
  envWithTpl: []

  # Metrics port for fluent-bit HTTP server
  metricsPort: 2020

  # Additional ports to expose
  extraPorts: []

  # Additional volumes
  extraVolumes: []

  # Additional containers to run in the pod
  extraContainers: []

  # Use host network
  hostNetwork: false

  extraVolumeMounts: []

  labels: {}

  annotations: {}

  podAnnotations: {}

  podLabels: {}

  # @schema
  # type: integer
  # @schema
  minReadySeconds: 0

  daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers
  - name: etcmachineid
    hostPath:
      path: /etc/machine-id
      type: File

  daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true
  - name: etcmachineid
    mountPath: /etc/machine-id
    readOnly: true

  initContainers: []

  args:
  - --workdir=/fluent-bit/etc
  - --config=/fluent-bit/etc/conf/fluent-bit.conf
  command:
  - /fluent-bit/bin/fluent-bit

  envFrom: []

  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

  # fluentbit liveness probe
  livenessProbe:
    httpGet:
      path: /
      port: http
      scheme: HTTP
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 3

  # fluentbit readiness probe
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 10
    failureThreshold: 3

  # fluentbit startup probe
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 30
    failureThreshold: 3

  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: false
    minPods: 1

  dnsPolicy: ClusterFirst

  restartPolicy: Always

  schedulerName: default-scheduler

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

  serviceAccount:
    enabled: true
    preexisting: false
    annotations: {}
    name: fluent-bit

  terminationGracePeriodSeconds: 30

