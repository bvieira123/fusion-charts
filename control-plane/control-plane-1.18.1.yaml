    preexisting: false
    annotations: {}
    name: "im"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
    - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  podAnnotations: {}

  ######################################
  ##      Service                    ##
  ######################################
  service:
    type: ClusterIP
    ports:
    - name: http
      protocol: TCP
      port: 9080
      targetPort: 9080

  ######################################
  ##      Resources and autoscaling   ##
  ######################################
  # JAVA_OPTS
  xms_xmx: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=90"
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 50m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"
    # reference the postgres target
    postgresoutboundRule: {}
      # use this to reference a networkset
      # selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

    # reference the mongodb target
    mongodboutboundRule:
      # use this to reference a networkset
      selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      #  nets:
      #  - 0.0.0.0/0 # put your subnet cidr here

    outboundRule:
      # use this to reference a networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

  #mamimum number of db connections allowed (to rds).
  database:
    maxPoolSize: "20" # default value

  ######################################
  ##      Common properties           ##
  ######################################

  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0
  report_batch_size: 10000
  #auditConsumerCount: 30
  report_and_purge_job_enabled: "true"
  report_and_purge_job_cron: "0 0 0 ? * * *"

  ######################################
