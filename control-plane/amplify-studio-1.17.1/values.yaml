######################################
##         marketplace-agent        ##
######################################
marketplaceAgent:
  enabled: true

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.17.1/marketplace-agent
    buildTag: 1.17.1

  resources:
    limits:
      cpu: 2000m
      memory: 3000Mi
    requests:
      cpu: 2000m
      memory: 3000Mi

  ######################################
  ##      Resources and autoscaling   ##
  ######################################
  # JAVA_OPTS
  xms_xmx: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=90 -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=$JBOSS_MODULES_SYSTEM_PKGS -Djava.awt.headless=true"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: [ ]

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  # TerminationGracePeriod
  #GracePeriod
  terminationGracePeriodSeconds: 60

  # marketplaceAgent: livenessProbe
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8181
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # marketplaceAgent: startupProbe
  startupProbe:
    httpGet:
      path: /q/health/ready
      port: 8181
    initialDelaySeconds: 10
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1

  # marketplaceAgent: readinessProbe
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8181
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 30
    failureThreshold: 3
    successThreshold: 1

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for marketplaceAgent
  serviceAccount:
    # Specifies whether a service account should be associated
    name: "marketplace-agent"
    enabled: true
    # Use a preexisting service account instead of recreating one
    preexisting: false
    # Annotations to add to the service account (if creating one and not reusing an existing one)
    annotations: {}
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  podAnnotations: {}

  ######################################
  ##      Service                    ##
  ######################################
  apiService:
    name: api
    port: 8080

  service:
    type: ClusterIP
    ports:
      - name: marketplaceagent
        protocol: TCP
        port: 8080
        targetPort: 8080

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    outboundRule:
      # use this to reference a networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
    #    nets:
    #      - 0.0.0.0/0 # put your subnet cidr here

  ######################################
  ##        Affinity                 ##
  ######################################
  nodeSelector: {}

  tolerations: []

  affinity: {}

  ######################################
  ##      Common values               ##
  ######################################
  replicaCount: 1
  maxSurge: 1
  maxUnavailable: 0
  nameOverride: ""
  fullnameOverride: ""

######################################
##         FluentBit                ##
######################################
fluentBit:
  enabled: false

  # Default set to DaemonSet
  # Possible Values : DaemonSet / Deployment
  # Configure it as Deployment for environments where root permission is not allowed and Fluent-Bit is used only for offloading logs to other locations
  kind: DaemonSet

  image:
    name: 1.17/fluent-bit
    buildTag: 5.0.6-axway-3

  nameOverride: ""

  podSecurityContextEnabled: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001


  calicoNetpol:
    enabled: false
    # reference the targets, fluentBit is allowed to reach
    outboundRule:
      # use this to reference a (preexisting) networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      #nets:
      #  - 0.0.0.0/0 # put your subnet cidr here

  # Configuration for custom service, inputs, filters, and outputs
  # Used by both DaemonSet and Deployment modes to extend FluentBit configuration
  config:
    service: ""
    inputs: ""
    filters: ""
    outputs: ""

  # Use existing ConfigMap for fluent-bit configuration instead of generated one
  existingConfigMap: ""

  # Environment variables
  env: [ ]

  # Environment variables with template support
  envWithTpl: [ ]

  # Metrics port for fluent-bit HTTP server
  metricsPort: 2020

  # Additional ports to expose
  extraPorts: [ ]

  # Additional volumes
  extraVolumes: [ ]

  # Additional containers to run in the pod
  extraContainers: [ ]

  # Use host network
  hostNetwork: false

  extraVolumeMounts: [ ]

  labels: { }

  annotations: { }

  podAnnotations: { }

  podLabels: { }

  # @schema
  # type: integer
  # @schema
  minReadySeconds: 0

  daemonSetVolumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
    - name: etcmachineid
      hostPath:
        path: /etc/machine-id
        type: File

  daemonSetVolumeMounts:
    - name: varlog
      mountPath: /var/log
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
    - name: etcmachineid
      mountPath: /etc/machine-id
      readOnly: true

  initContainers: []

  args:
    - --workdir=/fluent-bit/etc
    - --config=/fluent-bit/etc/conf/fluent-bit.conf
  command:
    - /fluent-bit/bin/fluent-bit

  envFrom: []

  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate

  # fluentbit liveness probe
  livenessProbe:
    httpGet:
      path: /
      port: http
      scheme: HTTP
    periodSeconds: 30
    successThreshold: 1
    timeoutSeconds: 10
    initialDelaySeconds: 60
    failureThreshold: 3

  # fluentbit readiness probe
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 10
    failureThreshold: 3

  # fluentbit startup probe
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: http
      scheme: HTTP
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
    initialDelaySeconds: 30
    failureThreshold: 3

  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: false
    minPods: 1

  dnsPolicy: ClusterFirst

  restartPolicy: Always

  schedulerName: default-scheduler

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  nodeSelector: { }
  tolerations: [ ]
  affinity: { }

  serviceAccount:
    enabled: true
    preexisting: false
    annotations: { }
    name: fluent-bit

  terminationGracePeriodSeconds: 30

