######################################
##      Globals                     ##
######################################
global:
  # Environment Properties
  appEnv: ""

  # Default currency ISO Code for tenant.
  default_currency_code: "USD"

  #Choose the HOSTNAME for your Control Plane
  external_domain: ""
  #image settings
  image:
    repository: docker.repository.axway.com/amplifyfusion-docker-prod
    #pullPolicy the image pull policy
    pullPolicy: IfNotPresent
    # imagePullSecrets - secret that stores credentials for access to a registry for docker images
    # This secret is the image pull secrets used by all the charts
    # Use your Axway credentials if pulling from the Axway repository
    # For a customer: create the secret:
    #      REGISTRY_USERNAME= # credentials from your service account
    #      REGISTRY_PASSWORD= # credentials from your service account
    #      REGISTRY_SERVER=docker.repository.axway.com
    #      kubectl create secret docker-registry ampint-docker-artifactory --docker-server="${REGISTRY_SERVER}" --docker-username="${REGISTRY_USERNAME}" --docker-password="${REGISTRY_PASSWORD}"
    imagePullSecrets:
      - name: ampint-docker-artifactory
    # If dockerconfigjson is set it will create a docker-registry secret called ampint-docker-artifactory using that value
    # If secrets are being managed externally leave this value blank
    createPullSecret:
      dockerconfigjson: ""
  initContainers:
    # ref: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    resources:
      limits:
        cpu: 100m
        memory: 100Mi
      requests:
        cpu: 100m
        memory: 100Mi

  # volumeMount name - name to identify the mounted volume - internal kubernetes use only
  volumeMounts:
    name: efs-storage

  # persistentVolumeClaim claimName is the name to be given the pvc - visible when listing the pvcs
  persistentVolumeClaim:
    claimName: efs-claim

  # Relational DataBase Properties - currently this is assumed to be postgres
  # Currently the database name must be dxchange
  rdb_name: "dxchange"
  # relational database endpoint - this will be your postgres service eg postgresdb-postgresql.mynamespace.svc.cluster.local
  rdb_endpoint: ""

  apiAuthPort: 8080
  auditSvcPort: 9080
  imMonitorPort: 9080
  sftp_server_port: 9022

  commonConfigmap: configmap-common
  # Alpine-tool image
  alpinetools:
    image:
      name: 1.17/alpine-tools
      buildTag: 1.5.2

  # Prefix for envoy loadbalancer domain name when deploying a shared Fusion i.e <shared_lb_prefix>.<ctlplane_domain>
  shared_lb_prefix: "ha-lb"

######################################
##          Common                  ##
######################################
common:
  enabled: true

  # AcceptGeneralConditions
  acceptGeneralConditions: "yes"

  nameOverride: ""

  ######################################
  ##      Hazelcast min member        ##
  ######################################
  min_member_count: 2

######################################
##          Logging                 ##
######################################

  # This setting controls whether the log files are generated in the efs_root filesystem or not.
  # If set to false logs will only be written to the console (This can be used in SaaS environments where Fluent Bit, running as a DaemonSet, captures logs directly from the node's container log stream).
  logFileEnabled: true

  # This setting controls the log output format.
  # If 'true', logs are written in JSON format.
  # If 'false', logs are written in plain text format.
  logJsonEnabled: true

######################################
##          Email Setting           ##
######################################
  # email setup
  admin_email: ""
  email_host: ""
  email_frommailid: ""
  support_email: ""
  admin_mail_notify_event_status: "true"

  authentication:
    enabled: false
    email_username: ""
    email_port: "587"

######################################
##              Storage             ##
######################################
  # EFS Information
  efs:
    enabled: false
    pv: efs-pv
    sc: efs-sc
    id: fs-xxxxxx
    capacity: 100Gi

  ## GENERIC PVC ##
  ## PVC and PV based on storage class only given by the K8S/OCP Administrator
  pvc:
    enabled: false
    claimAccessMode: ReadWriteMany
    claimRequestCapacity: ""
    storageClass: ""

  # EFS root path for logs and storage
  # Default: /efs
  # Override this if your EFS is mounted at a different path
  efs_root: "/efs"

  ######################################
  ##           Secrets                ##
  ######################################
  # This block generates secrets that will be used by the other Helm charts
  # ALL SECRETS HAVE TO BE ENCODED into base 64 (to avoid YAML issues):
  #    printf 'myvaluetoencode' | base64 -w 0

  # postgres secret settings
  postgresCredentials:
    name: "ampint-spring-datasource"
    existingSecret: false
    postgres_username: "" # base64 encoded
    postgres_password: "" # base64 encoded

  # cluster-details secret settings
  clusterDetails:
    name: "cluster-details"
    # set to true if managing secrets external to helm deployment
    existingSecret: false
    # jwt_secret, Cluster_id should be the same for both Studio and saas Fusion.
    # use password generator to generate password with 30 char length alpha Numaric charcters for JWT token.
    # use (https://www.uuidgenerator.net/) to generate cluster_id
    # Dxchange jwt-token for websocket connection between CP to DP
    jwt_secret: "" # base64 encoded
    cluster_id: "" # base64 encoded   ##use uuid for generate (https://www.uuidgenerator.net/)

  emailPassword:
    name: "email-password"
    existingSecret: false
    email_password: ""

  mongoDB:
    name: "ampint-mongodb-uri"
    # set to true if managing secrets external to helm deployment
    existingSecret: false
    mongo_uri: ""

  zipfile:
    name: "zipfile"
    # set to true if managing secrets external to helm deployment
    existingSecret: false
    zipfile_password: ""

  ######################################
  ##           ConfigMaps             ##
  ######################################
  # Set to true to manage ConfigMaps separately to the helm chart deployment
  #### WARNING!! ####
  # Values set in configMaps are critical to the functionality of the application
  # Names and values must be consistent with what is expected
  # If these are not managed correctly, the application may not work as intended
  externalConfigMaps: false

######################################
##           Predeploy              ##
######################################
predeploy:
  enabled: true

  ######################################
  ##     Security                     ##
  ######################################

  #serviceaccount for predeploy
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "predeploy"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

  ######################################
  ##           Resources              ##
  ######################################
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1500m
      memory: 1Gi

  ######################################
  ##     Migration jobs               ##
  ######################################
  masterschemamigration:
    enabled: false
    image:
      repository: ""
      name: 1.17.1/dxchange-schema-migration-job
      buildTag: 1.17.1
    # @schema
    # type: array
    # items:
    #   oneOf:
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         value:
    #           type: string
    #       required: [name, value]
    #       additionalProperties: false
    #     - type: object
    #       properties:
    #         name:
    #           type: string
    #         valueFrom:
    #           type: object
    #       required: [name, valueFrom]
    #       additionalProperties: false
    # @schema
    env:
      - name: JAVA_OPTS
        value: "-XX:+UseG1GC -XX:-G1PeriodicGCInvokesConcurrent -XX:G1PeriodicGCInterval=300000 -XX:MaxRAMPercentage=90"
  tenantmigration:
    enabled: false
    image:
      repository: ""
      name: 1.17.1/tenant-schema-migration-job
      buildTag: 1.17.1

  datamigration:
    enabled: false
    image:
      repository: ""
      name: 1.17.1/data-migration-job
      buildTag: 1.17.1

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    postgresoutboundRule: {}
      # use this to reference a networkset
      #selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

######################################
##           Frontend              ##
######################################
ui:
  enabled: true

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # ui: livenessProbe
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # ui: startupProbe
  startupProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 180
    successThreshold: 1

  # ui: readinessProbe
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 120
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.17.1/frontend
    buildTag: 1.17.1

  ######################################
  ##      Security                    ##
  ######################################

  # serviceaccount for ui
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "ui"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  podAnnotations: {}

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"

  ######################################
  ##      Resources and autoscaling   ##
  ######################################
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 1000m
      memory: 2000Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  ######################################
  ##      Service                    ##
  ######################################
  service:
    type: ClusterIP
    ports:
      - protocol: TCP
        port: 443
        targetPort: 8080

  ######################################
  ##      common properties           ##
  ######################################
  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0

  nameOverride: ""
  fullnameOverride: ""

  ######################################
  ##      Ingress and Affinity        ##
  ######################################
  # Ingress information
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: "*.{{- .Values.global.external_domain -}},{{- .Values.global.external_domain -}}"
      ingress.kubernetes.io/ssl-redirect: "true"
      kubernetes.io/tls-acme: "true"
      nginx.org/hsts: "true"
      nginx.org/hsts-max-age: "11536000"
      nginx.org/hsts-include-subdomains: "true"
      nginx.org/hsts-preload: "true"
    hosts:
      - host: "*.{{- .Values.global.external_domain -}}"
        paths:
          - path: /
            serviceName: ui-{{- .Values.global.appEnv -}}
            servicePort: 443
          - path: /api/
            serviceName: api-{{- .Values.global.appEnv -}}
            servicePort: 8080
      - host: "{{- .Values.global.external_domain -}}"
        paths:
          - path: /
            serviceName: ui-{{- .Values.global.appEnv -}}
            servicePort: 443
    tls:
      - hosts:
          - "*.{{- .Values.global.external_domain -}}"
        secretName: ui-wildard-certificate
      - hosts:
          - "{{- .Values.global.external_domain -}}"
        secretName: ui-certificate

  affinity: {}

  nodeSelector: {}

  tolerations: []

######################################
##           Hazelcast              ##
######################################
hazelcast:
  enabled: true
  kind: StatefulSet

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.17.1/hazelcast-server
    # Overrides the image tag whose default is the chart appVersion.
    buildTag: 1.17.1

  #Environment Properties
  hazelcastYaml: hazelcast-yaml
  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 3

  ######################################
  ##           Storage                 #
  ######################################

  ebs_root: "/mdisk"
  efs_load_store_queues: "false"
  efs_load_store_maps: "true"

  persistence:
    #claimTemplateRequestStorage storage request size for the claim template
    claimTemplateRequestStorage: 10Gi
    #claimTemplateStorageClass class that will dynamically create storage on desired cloud platform
    #For AWS set this value to gp3
    #For Azure set this value to managed-csi
    claimTemplateStorageClass: "gp3"
    #claimTemplateName name of the claim for hazelcast queue storage
    claimTemplateName: hazelcast-queue-storage
    #claimTemplateAccessModes access mode for claim template
    claimTemplateAccessModes: ReadWriteOnce

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  #TerminationGracePeriod
  terminationGracePeriodSeconds: "60"

  # hazelcast: livenessProbe
  livenessProbe:
    httpGet:
      path: /hazelcast/health
      port: 5701
    initialDelaySeconds: 30
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # hazelcast: startupProbe
  startupProbe:
    httpGet:
      path: /hazelcast/health/ready
      port: 5701
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1

  # hazelcast: readinessProbe
  readinessProbe:
    httpGet:
      path: /hazelcast/health/ready
      port: 5701
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30
    successThreshold: 1

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for hazelcast
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "hazelcast"
    automountServiceAccountToken: true

  podAnnotations: {}

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  ######################################
  ##      Service                    ##
  ######################################

  service:
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 5701
        targetPort: 5701

  ######################################
  ##      Resources                   ##
  ######################################
  #JAVA_OPTS
  xms_xmx: "-Dhazelcast.config=/data/hazelcast/hazelcast.yaml -XX:+UseG1GC -Xms3g -Xmx7g"
  agentOpts: "-javaagent:/app/lib/jmx_prometheus_javaagent-1.0.1.jar=8080:/app/jmx_exporter.yml"

  resources:
    limits:
      cpu: 3500m
      memory: 8000Mi
    requests:
      cpu: 3500m
      memory: 8000Mi

  nodeSelector: {}

  tolerations: []

  affinity: {}

  calicoNetpol:
    enabled: false

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: [ ]

######################################
##              API                 ##
######################################
api:
  enabled: true

  ######################################
  ##      Ingress and Affinity        ##
  ######################################
  #Ingress information
  ingress:
    enabled: true
    className: nginx
    #Ingress annotations
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      external-dns.alpha.kubernetes.io/hostname: "services.{{- .Values.global.external_domain -}}"
      ingress.kubernetes.io/ssl-redirect: "true"
      nginx.org/client-body-buffer-size: "100m"
      nginx.org/client-max-body-size: "100m"
      nginx.org/proxy-connect-timeout: "300"
      nginx.org/proxy-read-timeout: "300"
      nginx.org/proxy-send-timeout: "300"
      nginx.org/hsts: "true"
      nginx.org/hsts-max-age: "21536000"
      nginx.org/hsts-include-subdomains: "true"
      nginx.org/hsts-preload: "true"
    hosts:
      - host: "services.{{- .Values.global.external_domain -}}"
        paths:
          - path: /api/
            serviceName: api-{{- .Values.global.appEnv -}}
            servicePort: 8080
          - path: /api/monitor/
            serviceName: im-{{- .Values.global.appEnv -}}
            servicePort: 9080
          - path: /monitor/ws
            serviceName: im-{{- .Values.global.appEnv -}}
            servicePort: 9080
          - path: /auditservice/
            serviceName: auditservice-{{- .Values.global.appEnv -}}
            servicePort: 9080                                      # don't change the port
    tls:
      - hosts:
          - "services.{{- .Values.global.external_domain -}}"
        secretName: services-certificate

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.17.1/api
    buildTag: 1.17.1

  aws:
    enabled: false
    publicZoneId: ""
    region: ""

  #Email setting
  fulfillment_email: ""
  tenant_approver_email: ""

  emailPassword:
    enabled: false

  cloud_provider: "AWS"

  #ClusterSecretkeys(cluster_details) # if you're using shared Fusion make it true
  ClusterSecretKey:
    enabled: false

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for api
  serviceAccount:
    # Specifies whether a service account should be associated
    name: "api"
    enabled: true
    # Use a preexisting service account instead of recreating one
    preexisting: false
    # Annotations to add to the service account (if creating one and not reusing an existing one)
    annotations: {}
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault


  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  service:
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 8080
        targetPort: 8080
      - name: management
        protocol: TCP
        port: 8181
        targetPort: 8181

  xms_xmx: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=90 -Djava.net.preferIPv4Stack=true -Djboss.modules.system.pkgs=$JBOSS_MODULES_SYSTEM_PKGS -Djava.awt.headless=true"
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 1000m
      memory: 2000Mi

  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0

  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # api: livenessProbe
  livenessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # api: startupProbe
  startupProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 300
    successThreshold: 1

  # api: readinessProbe
  readinessProbe:
    httpGet:
      path: /api/health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 120
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  podAnnotations: {}

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  nodeSelector: {}

  tolerations: []

  affinity: {}

  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"
    # reference the postgres target
    postgresoutboundRule: {}
      # use this to reference a networkset
      # selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      #   - 0.0.0.0/0 # put your subnet cidr here
    # reference the outbound target
    outboundRule:
      # use this to reference a networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

  #podDisruptionBudget:
  #  enabled: false
  #  minPods: 1

  #SSE Static rout name
  sse_cluster_name: inbound-worker-sse

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: LOG_LEVEL
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: [ ]

######################################
##                IM                ##
######################################
im:
  enabled: true

  ######################################
  ##      ClusterSecretKeys           ##
  ######################################
  # ClusterSecretkeys(cluster_details) # if you're using shared Fusion make it true
  ClusterSecretKey:
    enabled: false

  ######################################
  ##      Probes/GracePeriod         ##
  ######################################
  # TerminationGracePeriod
  terminationGracePeriodSeconds: 60

  # im: livenessProbe
  livenessProbe:
    httpGet:
      path: /api/monitor/health
      port: 9080
    initialDelaySeconds: 300
    periodSeconds: 300
    timeoutSeconds: 120
    failureThreshold: 3
    successThreshold: 1

  # im: startupProbe
  startupProbe:
    httpGet:
      path: /openapi
      port: 8181
    initialDelaySeconds: 5
    periodSeconds: 1
    timeoutSeconds: 1
    failureThreshold: 180
    successThreshold: 1

  # im: readinessProbe
  readinessProbe:
    httpGet:
      path: /api/monitor/health
      port: 9080
    initialDelaySeconds: 10
    periodSeconds: 60
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1

  ######################################
  ##      Image                       ##
  ######################################
  image:
    repository: ""
    name: 1.17.1/integration-manager
    buildTag: 1.17.1

  ######################################
  ##      Security                    ##
  ######################################

  #serviceaccount for im
  serviceAccount:
    enabled: true
    # Use preexisting: true if you want to use a preexisting service account (e.g. created by the infra)
    preexisting: false
    annotations: {}
    name: "im"
    automountServiceAccountToken: true

  podSecurityContext:
    supplementalGroups:
      - 1001
    # @schema
    # type: [string, integer, null]
    # @schema
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsUser: 10010
    # @schema
    # type: [string, integer, null]
    # @schema
    runAsGroup: 10020
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
      - ALL

  podAnnotations: {}

  ######################################
  ##      Service                    ##
  ######################################
  service:
    type: ClusterIP
    ports:
      - name: http
        protocol: TCP
        port: 9080
        targetPort: 9080

  ######################################
  ##      Resources and autoscaling   ##
  ######################################
  # JAVA_OPTS
  xms_xmx: "-XX:MinRAMPercentage=50 -XX:MaxRAMPercentage=90"
  resources:
     limits:
       cpu: 3000m
       memory: 6000Mi
     requests:
       cpu: 3000m
       memory: 6000Mi

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 75

  nodeSelector: {}

  tolerations: []

  affinity: {}

  ######################################
  ##      Network Policies            ##
  ######################################
  calicoNetpol:
    enabled: false
    ingressController:
      podSelector: "has(app.kubernetes.io/name) && app.kubernetes.io/name == 'nginx-ingress'"
      namespace: "add-ons"
    # reference the postgres target
    postgresoutboundRule: {}
      # use this to reference a networkset
      # selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

    # reference the mongodb target
    mongodboutboundRule:
      # use this to reference a networkset
      selector: role == 'nodes-subnet-vpc-cidr'
      # or uncomment this to directly reference IP cidr instead
      #  nets:
      #  - 0.0.0.0/0 # put your subnet cidr here

    outboundRule:
      # use this to reference a networkset
      selector: role == 'any-address'
      # or uncomment this to directly reference IP cidr instead
      # nets:
      # - 0.0.0.0/0 # put your subnet cidr here

  ######################################
  ##      Common properties           ##
  ######################################

  nameOverride: ""
  fullnameOverride: ""

  replicaCount: 1
  maxSurge: 100%
  maxUnavailable: 0
  report_batch_size: 10000
  #auditConsumerCount: 30
  report_and_purge_job_enabled: "true"
  report_and_purge_job_cron: "0 0 0 ? * * *"

  ######################################
  ##      Env   ##
  ######################################
  # Provide environment variables or override default application.properties
  # Define key values in form of name and value, e.g.:
  # env:
  #   - name: quarkus.log.level
  #     value: DEBUG
  # @schema
  # type: array
  # items:
  #   oneOf:
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         value:
  #           type: string
  #       required: [name, value]
  #       additionalProperties: false
  #     - type: object
  #       properties:
  #         name:
  #           type: string
  #         valueFrom:
  #           type: object
  #       required: [name, valueFrom]
  #       additionalProperties: false
  # @schema
  env: [ ]

