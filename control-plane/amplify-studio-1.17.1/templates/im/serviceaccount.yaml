{{- if ( and .Values.im.serviceAccount.enabled ( not .Values.im.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "im.serviceAccountName" . }}
  labels:
    {{- include "im.labels" . | nindent 4 }}
  {{- with .Values.im.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.im.serviceAccount.automountServiceAccountToken }}
{{- end }}
