{{- if .Values.ui.ingress.enabled -}}
{{- $pathType := default "Prefix" .Values.ui.ingress.pathType -}}
apiVersion: networking.k8s.io/v1

kind: Ingress
metadata:
  name: {{ template "ui.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ui.labels" . | nindent 4 }}
  annotations:
  {{- with .Values.ui.ingress.annotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with .Values.ui.ingress.additionalAnnotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ui.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ui.ingress.className }}
  {{- end }}
  {{- if .Values.ui.ingress.tls }}
  tls:
    {{- range .Values.ui.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ tpl . $ | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ui.ingress.hosts }}
    - {{ with .host }}host: {{ tpl . $ | quote }}{{ end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and $pathType  (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ $pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ tpl .serviceName $ }}
                port:
                  {{- with .servicePort }}
                  number: {{ . }}
                  {{- end }}
                  {{- with .servicePortName}}
                  name: {{ . }}
                  {{- end }}
              {{- end }}
          {{- end }}
    {{- end }}
  {{- end }}
