{{- if eq .Values.common.externalConfigMaps false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: "environment-url"
  namespace: {{ .Release.Namespace }}
data:
  environment.json: |
    {
    {{- if regexMatch "^ampint-[0-9.]+_[0-9][0-9][0-9][0-9].*$" .Values.ui.image.buildTag }}
      "deployed_version": "{{ regexReplaceAll "^ampint-([0-9.]+)_[0-9][0-9][0-9][0-9].*$" .Values.ui.image.buildTag "${1}" }}",
     {{- else if regexMatch "^([^_]+)_[0-9][0-9][0-9][0-9].*$" .Values.ui.image.buildTag  }}
      "deployed_version": "{{ regexReplaceAll "^([^_]+)_[0-9][0-9][0-9][0-9].*$" .Values.ui.image.buildTag "${1}" }}",
    {{- else if regexMatch "^(.+)-SNAPSHOT$" .Values.ui.image.buildTag }}
      "deployed_version": "{{ regexReplaceAll "^(.+)-SNAPSHOT$" .Values.ui.image.buildTag "${1}" }}",
    {{- else }}
      "deployed_version": "{{ .Values.ui.image.buildTag }}",
    {{- end }}
      "hostName": "{{ .Values.global.external_domain }}",
      "singleTenantMode": {{ .Values.common.singleTenantMode | default false | toJson }}
    }
{{- end }}
