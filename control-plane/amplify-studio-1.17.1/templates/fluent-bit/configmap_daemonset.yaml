{{- if and .Values.fluentBit.enabled (eq .Values.fluentBit.kind "DaemonSet") -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "fluent-bit.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fluent-bit.labels" . | nindent 4 }}
data:
  custom_parsers.conf: |
    [PARSER]
        Name docker_no_time
        Format json
        Time_Keep Off
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
  fluent-bit.conf: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        storage.path /var/log/fluent-bit/storage
        storage.backlog.flush_on_shutdown On
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

    {{- with .Values.fluentBit.config.service }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

    [INPUT]
        Name tail
        Path /var/log/containers/*api*.log
        multiline.parser docker, cri
        DB /var/log/fluent-bit/storage/api-tail.db
        storage.type filesystem
        read_from_head true
        Tag api.app.log*
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/*auditservice*.log
        multiline.parser docker, cri
        DB /var/log/fluent-bit/storage/auditservice-tail.db
        storage.type filesystem
        read_from_head true
        Tag auditservice.app.log*
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/*im-*.log
        multiline.parser docker, cri
        DB /var/log/fluent-bit/storage/im-tail.db
        storage.type filesystem
        read_from_head true
        Tag im.app.log*
        Skip_Long_Lines On


    [INPUT]
        Name tail
        Path /var/log/containers/*marketplace-agent*.log
        multiline.parser docker, cri
        DB /var/log/fluent-bit/storage/marketplace-agent-tail.db
        storage.type filesystem
        read_from_head true
        Tag marketplace.app.log*
        Skip_Long_Lines On

    [INPUT]
        Name tail
        Path /var/log/containers/*hazelcast*.log
        multiline.parser docker, cri
        DB /var/log/fluent-bit/storage/hazelcast-tail.db
        storage.type filesystem
        read_from_head true
        Tag hazelcast.app.log*
        Skip_Long_Lines On

    {{- with .Values.fluentBit.config.inputs }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

    {{- with .Values.fluentBit.config.filters }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}

    {{- with .Values.fluentBit.config.outputs }}
    {{ tpl . $ | nindent 4 }}
    {{- end }}
{{- end }}
