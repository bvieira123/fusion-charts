{{- if .Values.common.efs.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.global.persistentVolumeClaim.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.common.efs.sc }}
  resources:
    requests:
      storage: {{ .Values.common.efs.capacity }}
{{- end -}}
