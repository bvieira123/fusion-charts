{{- if .Values.common.emailPassword.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.common.emailPassword.name ).metadata | required "Secret .Values.common.emailPassword.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.common.emailPassword.name }}
type: "Opaque"
data:
  dxchange_email_frompassword: {{ required "Value email_password is required for the secret email-password"  .Values.common.emailPassword.email_password }}
{{- end }}
