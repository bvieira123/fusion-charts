{{- if .Values.common.postgresCredentials.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.common.postgresCredentials.name ).metadata | required "Secret .Values.common.postgresCredentials.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.common.postgresCredentials.name }}
type: "Opaque"
data:
  spring_datasource_username: {{ required "Value postgres_username is required for the database secret"  .Values.common.postgresCredentials.postgres_username }}
  spring_datasource_password: {{ required "Value postgres_username is required for the database secret"  .Values.common.postgresCredentials.postgres_password }}
{{- end }}
