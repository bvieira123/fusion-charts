{{- if and .Values.im.UsageReporting .Values.im.UsageReporting.enabled .Values.common.chimeraUsageReporting.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.common.chimeraUsageReporting.name ).metadata | required "Secret .Values.common.chimeraUsageReporting.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else if and .Values.im.UsageReporting .Values.im.UsageReporting.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.common.chimeraUsageReporting.name }}
type: "Opaque"
data:
  chimera_base_url: {{ required "Value chimera_base_url is required for the secret chimera-usage-reporting"  .Values.common.chimeraUsageReporting.chimera_base_url }}
  chimera_client_key: {{ required "Value chimera_client_key is required for the secret chimera-usage-reporting"  .Values.common.chimeraUsageReporting.chimera_client_key }}
{{- end }}
