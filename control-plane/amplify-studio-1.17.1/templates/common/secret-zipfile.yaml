{{- if .Values.common.zipfile.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.common.zipfile.name ).metadata | required "Secret .Values.common.zipfile.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.common.zipfile.name }}
type: "Opaque"
data:
  zipfile_password: {{ required "Value zipfile_password is required for the secret zipfile"  .Values.common.zipfile.zipfile_password }}
{{- end }}
