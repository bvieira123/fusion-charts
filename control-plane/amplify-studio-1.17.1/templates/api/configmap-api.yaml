{{- if eq .Values.common.externalConfigMaps false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "api.appName" . }}
  namespace: {{ .Release.Namespace }}
data:
  JAVA_OPTS: "{{ .Values.api.xms_xmx }}"
  auth_service_base_url: http://{{ template "api.appName" . }}:{{ .Values.global.apiAuthPort }}/api
  #helper function for im.appName rendering as im-im instead of im-<appEnv> thus this syntax was required
  monitor_service_base_url: http://im-{{ .Values.global.appEnv }}:{{ .Values.global.imMonitorPort }}/api/monitor
  database_masterschema: {{ .Values.global.rdb_name }}
  spring_datasource_driver_class_name: org.postgresql.Driver
  spring_datasource_url: jdbc:postgresql://{{ .Values.global.rdb_endpoint }}/{{ .Values.global.rdb_name }}
  hazelcast_server_ip: {{ template "hazelcast.appName" . }}.{{ .Release.Namespace }}.svc.cluster.local
  default_currency_code: {{ .Values.global.default_currency_code }}
  environment: {{ .Values.global.appEnv }}
  domain: {{ .Values.global.external_domain }}
  singleTenantMode: "{{ .Values.common.singleTenantMode | default false }}"
  {{- with .Values.api.requestBodyHash }}
  requestBodyHashEnabled: "{{ .enabled }}"
  requestBodyHashAlgorithm: "{{ .algorithm }}"
  requestBodyHashHeaderName: "{{ .headerName }}"
  {{- end }}
  sftp_server_port: "{{ .Values.global.sftp_server_port }}"
  tenant_namespace: "{{ .Release.Namespace }}"
  haproxy_eip: "{{ .Values.global.shared_lb_prefix }}.{{ .Values.global.external_domain }}"
  fulfillment_email: "{{ .Values.api.fulfillment_email }}"
  tenant_approver_email: "{{ .Values.api.tenant_approver_email }}"
  cloud_provider: "{{ .Values.api.cloud_provider }}"
  sse_cluster_name: "{{ .Values.api.sse_cluster_name }}"
  {{- if .Values.api.aws.enabled }}
  aws_route_53_zone_id: {{ .Values.api.aws.publicZoneId }}
  aws_route_53_region: "{{ .Values.api.aws.region }}"
  {{- end -}}
{{- end }}
