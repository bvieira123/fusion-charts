{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "api.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  minReadySeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.api.maxSurge }}
      maxUnavailable: {{ .Values.api.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "api.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- with .Values.global.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.api.serviceAccount.enabled }}
      serviceAccountName: {{ include "api.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - name: use-vc
      initContainers:
        - name: "wait-predeploy"
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: "{{ default .Values.global.image.repository .Values.global.alpinetools.image.repository }}/{{ .Values.global.alpinetools.image.name }}:{{ .Values.global.alpinetools.image.buildTag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - >
              sleep 4;
              if [[ "$(kubectl get pod --no-headers -o custom-columns=":metadata.name" --selector=ampint.ctlplane==master-schema-job)" != "" ]];
              then until kubectl wait --for=condition=complete --timeout=0 job/$(kubectl get job --no-headers -o custom-columns=":metadata.name" --selector=ampint.ctlplane==master-schema-job);
              do echo "waiting for predeploy job to complete"; sleep 30; done; else echo "Predeploy not running" exit; fi
          {{- with .Values.global.initContainers.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: {{ template "api.appName" . }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: "{{ default .Values.global.image.repository .Values.api.image.repository }}/{{ .Values.api.image.name }}:{{ .Values.api.image.buildTag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          envFrom:
           {{- if .Values.api.emailPassword.enabled }}
            - secretRef:
                name: {{ .Values.common.emailPassword.name }}
            {{- end }}
            - secretRef:
                name: {{ .Values.common.postgresCredentials.name }}
            - secretRef:
                name: {{ .Values.common.zipfile.name }}
            {{- if .Values.api.ClusterSecretKey.enabled }}
            - secretRef:
                name: {{ .Values.common.clusterDetails.name }}
            {{- end }}
            - configMapRef:
                name: {{ template "api.appName" . }}
            - configMapRef:
                name: {{ .Values.global.commonConfigmap }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with .Values.api.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8181
              name: management
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe: {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          startupProbe: {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe: {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          volumeMounts:
            - name: {{ .Values.global.volumeMounts.name }}
              mountPath: /efs
            - name: tmp
              mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      - name: {{ .Values.global.volumeMounts.name }}
        persistentVolumeClaim:
          claimName: {{ .Values.global.persistentVolumeClaim.claimName }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
