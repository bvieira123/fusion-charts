apiVersion: v1
kind: Service
metadata:
  name: {{ template "marketplace-agent.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marketplace-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.marketplaceAgent.service.type }}
  selector:
    {{- include "marketplace-agent.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $port := .Values.marketplaceAgent.service.ports }}
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort }}
    {{- end }}
