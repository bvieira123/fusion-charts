{{- if eq .Values.common.externalConfigMaps false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.hazelcast.hazelcastYaml }}
  namespace: {{ .Release.Namespace }}
data:
  hazelcast.yaml: |-
    hazelcast:
      network:
        join:
          multicast:
            enabled: false
          kubernetes:
            enabled: true
            namespace: {{ .Release.Namespace }}
            service-name: {{ template "hazelcast.appName" . }}
        rest-api:
          enabled: true
          endpoint-groups:
            HEALTH_CHECK:
              enabled: true
{{- end }}
