{{- if ( and .Values.hazelcast.serviceAccount.enabled ( not .Values.hazelcast.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hazelcast.serviceAccountName" . }}
  labels:
    {{- include "hazelcast.labels" . | nindent 4 }}
  {{- with .Values.hazelcast.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.hazelcast.serviceAccount.automountServiceAccountToken }}
{{- end }}
