{{- if ( and .Values.auditservice.serviceAccount.enabled ( not .Values.auditservice.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "auditservice.serviceAccountName" . }}
  labels:
    {{- include "auditservice.labels" . | nindent 4 }}
  {{- with .Values.auditservice.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.auditservice.serviceAccount.automountServiceAccountToken }}
{{- end }}
