{{- if .Values.auditservice.calicoNetpol.enabled }}
### Open any additional ports for the ingress controller to ampint.ctlplane pods & namespace
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ template "auditservice.appName" . }}-ingress-controller
  namespace: {{ .Values.auditservice.calicoNetpol.ingressController.namespace }}
spec:
  order: 10
  selector: {{ .Values.auditservice.calicoNetpol.ingressController.podSelector }}
  types:
    - Egress
  egress:
    - action: Allow
      protocol: TCP
      source:
        selector: {{ .Values.auditservice.calicoNetpol.ingressController.podSelector }}
      destination:
        selector: has(ampint.ctlplane)
        namespaceSelector: projectcalico.org/name == "{{ .Release.Namespace }}"
        ports:
          - 9080
          - 443
          - 80
{{- end }}