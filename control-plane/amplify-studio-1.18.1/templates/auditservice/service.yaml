apiVersion: v1
kind: Service
metadata:
  name: {{ template "auditservice.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auditservice.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auditservice.service.type }}
  selector:
    {{- include "auditservice.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $port := .Values.auditservice.service.ports }}
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort }}
    {{- end }}
