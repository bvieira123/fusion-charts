{{- if .Values.storage.efs.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.storage.persistentVolumeClaim.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: {{ .Values.storage.efs.sc }}
  resources:
    requests:
      storage: {{ .Values.storage.efs.capacity }}
{{- end -}}
