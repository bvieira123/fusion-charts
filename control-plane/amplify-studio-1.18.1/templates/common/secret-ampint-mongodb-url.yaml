{{- if .Values.secrets.mongoDB.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.mongoDB.name ).metadata | required "Secret .Values.secrets.mongoDB.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.mongoDB.name }}
type: "Opaque"
data:
  mongo_uri: {{ required "Value secrets.mongoDB.uri is required for the secret ampint-mongodb-uri"  .Values.secrets.mongoDB.uri }}
{{- end }}
