{{- if .Values.secrets.postgres.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.postgres.name ).metadata | required "Secret .Values.secrets.postgres.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.postgres.name }}
type: "Opaque"
stringData:
  spring_datasource_username: {{ required "Value secrets.postgres.username is required for the database secret"  .Values.secrets.postgres.username }}
  spring_datasource_password: {{ required "Value secrets.postgres.password is required for the database secret"  .Values.secrets.postgres.password }}
{{- end }}
