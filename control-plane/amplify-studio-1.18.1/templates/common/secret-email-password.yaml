{{- if .Values.email.authentication.enabled -}}
{{- if .Values.email.credentials.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.email.credentials.name ).metadata | required "Secret .Values.email.credentials.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.email.credentials.name }}
type: "Opaque"
stringData:
  dxchange_email_username: {{ required "Value email.credentials.username is required for the email credentials secret" .Values.email.credentials.username }}
  dxchange_email_frompassword: {{ required "Value email.credentials.password is required for the email credentials secret" .Values.email.credentials.password }}
{{- end }}
{{- end }}
