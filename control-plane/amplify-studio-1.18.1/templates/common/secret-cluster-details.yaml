{{- if .Values.secrets.clusterDetails.existingSecret -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.clusterDetails.name ).metadata | required "Secret .Values.secrets.clusterDetails.name is required. Create it external to helm chart or set existingSecret to false" }}
{{- else }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.clusterDetails.name }}
type: "Opaque"
stringData:
  dxchange_jwt_secret:  {{ required "Value secrets.clusterDetails.jwtSecret is required for the secret cluster-details"  .Values.secrets.clusterDetails.jwtSecret }}
  cluster_id:  {{ required "Value secrets.clusterDetails.clusterId is required for the secret cluster-details"  .Values.secrets.clusterDetails.clusterId }}
{{- end }}
