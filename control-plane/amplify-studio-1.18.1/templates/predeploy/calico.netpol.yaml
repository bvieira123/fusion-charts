{{- if .Values.predeploy.calicoNetpol.enabled }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ template "predeploy.appName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  order: 10
  selector: ampint.ctlplane == 'master-schema-job'
  types:
    - Ingress
    - Egress
  egress:
    # allow to communicate with k8s api server
    - action: Allow
      destination:
        services:
          name: kubernetes
          namespace: default
      protocol: TCP
    ### Traffic to the postgresoutboundRule ###
    - action: Allow
      protocol: TCP
      destination: {{ toYaml .Values.predeploy.calicoNetpol.postgresoutboundRule | nindent 8 }}
{{- end }}