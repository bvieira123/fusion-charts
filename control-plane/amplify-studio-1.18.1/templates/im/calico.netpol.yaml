{{- if .Values.im.calicoNetpol.enabled }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ template "im.appName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  order: 10
  selector: ampint.ctlplane == 'im'
  types:
    - Ingress
    - Egress
  ingress:
    # allow: ingress-controller -> pod
    - action: Allow
      protocol: TCP
      source:
        namespaceSelector: projectcalico.org/name == '{{ .Values.im.calicoNetpol.ingressController.namespace }}'
        selector: {{ .Values.im.calicoNetpol.ingressController.podSelector }}
      destination:
        ports:
          {{- range .Values.im.service.ports }}
          - {{ .targetPort }}
          {{- end }}
    # allow: all ampint pod in namespace -> pod
    - action: Allow
      protocol: TCP
      source:
        selector: has(ampint.ctlplane)
      destination:
        ports:
          {{- range .Values.im.service.ports }}
          - {{ .targetPort }}
          {{- end }}
  egress:
    # allow: pod -> k8s dns (for service name)
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    # allow: pod -> hazelcast
    - action: Allow
      protocol: TCP
      destination:
        selector: ampint.ctlplane == 'hazelcast'
        ports:
          - 5701
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    ### postgres## Traffic to the internet ###
    - action: Allow
      protocol: TCP
      destination: {{ toYaml .Values.im.calicoNetpol.postgresoutboundRule | nindent 8 }}
   ###mongodb
    - action: Allow
      protocol: TCP
      destination: {{ toYaml .Values.im.calicoNetpol.mongodboutboundRule | nindent 8 }}
    ###outbound
    - action: Allow
      protocol: TCP
      destination: {{ toYaml .Values.im.calicoNetpol.outboundRule | nindent 8 }}
{{- end }}