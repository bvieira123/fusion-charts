{{- if .Values.fluentBit.calicoNetpol.enabled }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ template "fluent-bit.appName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  order: 10
  selector: ampint.ctlplane == 'fluent-bit'
  types:
    - Ingress
    - Egress
  ingress:
    # allow: all ampint pods in control plane namespace
    - action: Allow
      protocol: TCP
      source:
        selector: has(ampint.ctlplane)
  egress:
    # allow to communicate to DNS pods
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    # allow to communicate with itself for clustering
    - action: Allow
      destination:
        selector: ampint.ctlplane == 'fluent-bit'
        namespaceSelector: projectcalico.org/name == '{{ .Release.Namespace }}'
      protocol: TCP
    # allow to communicate with k8s api server
    - action: Allow
      destination:
        services:
          name: kubernetes
          namespace: default
      protocol: TCP
    # allow outbound connections as configured
    {{- with .Values.fluentBit.calicoNetpol.outboundRule }}
    - action: Allow
      protocol: TCP
      destination:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
