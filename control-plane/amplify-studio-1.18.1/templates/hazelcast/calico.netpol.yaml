{{- if .Values.hazelcast.calicoNetpol.enabled }}
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: {{ template "hazelcast.appName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  order: 10
  selector: ampint.ctlplane == 'hazelcast'
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      protocol: TCP
      source:
        selector: has(ampint.ctlplane)
      destination:
        ports:
          {{- range .Values.hazelcast.service.ports }}
          - {{ .targetPort }}
          {{- end }}
    - action: Allow
      protocol: TCP
      source:
        selector: ampint.ctlplane == 'hazelcast'
      destination:
        ports:
          {{- range .Values.hazelcast.service.ports}}
          - {{ .targetPort }}
          {{- end}}
  egress:
    # allow to communicate to DNS pods
    - action: Allow
      protocol: UDP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    - action: Allow
      protocol: TCP
      destination:
        namespaceSelector: projectcalico.org/name == 'kube-system'
        ports:
          - 53
    # allow to communicate with k8s api server
    - action: Allow
      destination:
        services:
          name: kubernetes
          namespace: default
      protocol: TCP
    # allow to communicate with itself for clustering
    - action: Allow
      destination:
        ports:
          {{- range .Values.hazelcast.service.ports }}
          - {{ .targetPort }}
          {{- end }}
        selector: ampint.ctlplane == 'hazelcast'
      protocol: TCP
{{- end }}