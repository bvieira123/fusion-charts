{{- if .Values.hazelcast.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "hazelcast.appName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hazelcast.labels" . | nindent 4 }}
spec:
  type: {{ .Values.hazelcast.service.type }}
  selector:
    {{- include "hazelcast.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $port := .Values.hazelcast.service.ports }}
    - name: {{ $port.name }}
      protocol: {{ $port.protocol }}
      port: {{ $port.port }}
      targetPort: {{ $port.targetPort }}
    {{- end }}
{{- end }}
