{{- if eq .Values.externalConfigMaps false }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "hazelcast.appName" . }}
  namespace: {{ .Release.Namespace }}
data:
  JAVA_OPTS: "{{ .Values.hazelcast.xms_xmx }}"
  AGENT_OPTS: "{{ .Values.hazelcast.agentOpts }}"
  kubernetes_service_name: "{{ template "hazelcast.appName" . }}"
  environment: "{{ .Values.appEnv }}"
  {{- if eq (lower .Values.hazelcast.kind) "statefulset" }}
  ebs_root: "{{ .Values.hazelcast.ebs_root }}"
  efs_load_store_queues: "{{ .Values.hazelcast.efs_load_store_queues }}"
  efs_load_store_maps: "{{ .Values.hazelcast.efs_load_store_maps }}"
  {{- else }}
  efs_load_store_queues: "true"
  efs_load_store_maps: "true"
  {{- end }}
{{- end }}