{{- if ( and .Values.hazelcast.serviceAccount.enabled ( not .Values.hazelcast.serviceAccount.preexisting ) ) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hazelcast-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hazelcast-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.hazelcast.serviceAccount.enabled | ternary .Values.hazelcast.serviceAccount.name "default" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
