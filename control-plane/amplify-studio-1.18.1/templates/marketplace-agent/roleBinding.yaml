{{- if ( and .Values.marketplaceAgent.serviceAccount.enabled ( not .Values.marketplaceAgent.serviceAccount.preexisting ) ) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marketplaceAgent-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: marketplaceAgent-role
subjects:
  - kind: ServiceAccount
    name: {{ .Values.marketplaceAgent.serviceAccount.enabled | ternary .Values.marketplaceAgent.serviceAccount.name "default" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
