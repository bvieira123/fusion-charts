{{- if ( and .Values.marketplaceAgent.serviceAccount.enabled ( not .Values.marketplaceAgent.serviceAccount.preexisting ) ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "marketplace-agent.serviceAccountName" . }}
  labels:
    {{- include "marketplace-agent.labels" . | nindent 4 }}
  {{- with .Values.marketplaceAgent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.marketplaceAgent.serviceAccount.automountServiceAccountToken }}
{{- end }}
